AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  fukuda-nwc-poc - phase 2 graph stack. One Neptune cluster (IAM auth, one db.t4g.medium instance) holds the network topology
  (device vertices, link edges). The chat runtime and the web read it through boto3 neptunedata (Gremlin); the web can also edit it.
  Without this stack both fall back to the static data in agent/data/. Costs about 0.12 USD per hour while it exists - delete it the same day.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: { default: Naming }
        Parameters: [NamePrefix, Owner]
      - Label: { default: Network (same VPC as main.yaml) }
        Parameters: [VpcId, SubnetIds, RuntimeSecurityGroupId, InstanceSecurityGroupId]
      - Label: { default: Neptune }
        Parameters: [InstanceClass, EngineVersion, DeletionProtection]

Parameters:
  NamePrefix:
    Type: String
    Default: fukuda-nwc-poc
    AllowedPattern: "^[a-z][a-z0-9-]{1,24}$"
    Description: Same value as main.yaml (the IAM role names <NamePrefix>-runtime / <NamePrefix>-web get the Neptune policy)
  Owner:
    Type: String
    Default: fukuda
    AllowedPattern: "^[A-Za-z0-9._-]{1,64}$"
    Description: Value of the owner tag
  VpcId:
    Type: AWS::EC2::VPC::Id
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: At least two private subnets in two AZs (Neptune subnet group). The runtime subnets of main.yaml are fine.
  RuntimeSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: Output RuntimeSecurityGroupId of main.yaml (the AgentCore runtime reaches Neptune from here)
  InstanceSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: Output InstanceSecurityGroupId of main.yaml (the chat web EC2 reaches Neptune from here)
  InstanceClass:
    Type: String
    Default: db.t4g.medium
    AllowedValues: [db.t4g.medium, db.r6g.large]
    Description: db.t4g.medium is the smallest Neptune class (about 0.11 USD per hour in Tokyo - price not yet verified with the pricing API)
  EngineVersion:
    Type: String
    Default: 1.4.8.0
    AllowedPattern: "^[0-9]+([.][0-9]+){2,3}$"
    Description: Neptune engine version (1.4.8.0 checked 2026-09-15). Fails at deploy time if the region does not offer it.
  DeletionProtection:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: Keep false so the stack can be deleted the same day

Conditions:
  DeletionProtectionCond: !Equals [!Ref DeletionProtection, "true"]

Resources:
  # ---------------------------------------------------------------- network
  DbSubnetGroup:
    Type: AWS::Neptune::DBSubnetGroup
    Properties:
      DBSubnetGroupName: !Sub ${NamePrefix}-graph
      DBSubnetGroupDescription: !Sub ${NamePrefix} Neptune subnets
      SubnetIds: !Ref SubnetIds
      Tags:
        - { Key: Project, Value: !Ref NamePrefix }
        - { Key: owner, Value: !Ref Owner }

  NeptuneSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub ${NamePrefix}-neptune
      GroupDescription: !Sub ${NamePrefix} Neptune - 8182 from the runtime and the web
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 8182, ToPort: 8182, SourceSecurityGroupId: !Ref RuntimeSecurityGroupId, Description: AgentCore runtime }
        - { IpProtocol: tcp, FromPort: 8182, ToPort: 8182, SourceSecurityGroupId: !Ref InstanceSecurityGroupId, Description: chat web }
      SecurityGroupEgress:
        - { IpProtocol: "-1", CidrIp: 127.0.0.1/32, Description: none }
      Tags:
        - { Key: Name, Value: !Sub "${NamePrefix}-neptune" }
        - { Key: Project, Value: !Ref NamePrefix }
        - { Key: owner, Value: !Ref Owner }

  # ---------------------------------------------------------------- neptune
  Cluster:
    Type: AWS::Neptune::DBCluster
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      DBClusterIdentifier: !Sub ${NamePrefix}-graph
      EngineVersion: !Ref EngineVersion
      DBPort: 8182
      IamAuthEnabled: true
      StorageEncrypted: true
      BackupRetentionPeriod: 1
      DeletionProtection: !If [DeletionProtectionCond, true, false]
      DBSubnetGroupName: !Ref DbSubnetGroup
      VpcSecurityGroupIds: [!Ref NeptuneSecurityGroup]
      Tags:
        - { Key: Project, Value: !Ref NamePrefix }
        - { Key: owner, Value: !Ref Owner }

  Instance:
    Type: AWS::Neptune::DBInstance
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      DBInstanceIdentifier: !Sub ${NamePrefix}-graph-1
      DBClusterIdentifier: !Ref Cluster
      DBInstanceClass: !Ref InstanceClass
      AutoMinorVersionUpgrade: false
      Tags:
        - { Key: Project, Value: !Ref NamePrefix }
        - { Key: owner, Value: !Ref Owner }

  # topology.py / graph.py read the endpoint from here (env PARAM_PREFIX = /<NamePrefix> in main.yaml)
  EndpointParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /${NamePrefix}/neptune-endpoint
      Type: String
      Value: !Sub "${Cluster.Endpoint}:${Cluster.Port}"
      Description: Neptune writer endpoint host:port for the chat runtime and the web (graph.yaml)
      Tags: { Project: !Ref NamePrefix, owner: !Ref Owner }

  # ---------------------------------------------------------------- access for main.yaml roles
  GraphPolicy:
    Type: AWS::IAM::Policy
    DependsOn: Instance
    Properties:
      PolicyName: !Sub ${NamePrefix}-graph-access
      Roles: [!Sub "${NamePrefix}-runtime", !Sub "${NamePrefix}-web"]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: Gremlin
            Effect: Allow
            Action:
              - neptune-db:ReadDataViaQuery
              - neptune-db:WriteDataViaQuery
              - neptune-db:DeleteDataViaQuery
              - neptune-db:GetEngineStatus
              - neptune-db:GetQueryStatus
              - neptune-db:CancelQuery
            Resource: !Sub arn:${AWS::Partition}:neptune-db:${AWS::Region}:${AWS::AccountId}:${Cluster.ClusterResourceId}/*
          - Sid: Parameters
            Effect: Allow
            Action: ssm:GetParameter
            Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${NamePrefix}/*

Outputs:
  ClusterEndpoint:
    Description: Writer endpoint (host). Port is 8182.
    Value: !GetAtt Cluster.Endpoint
  ClusterResourceId:
    Value: !GetAtt Cluster.ClusterResourceId
  EndpointParameterName:
    Description: SSM parameter the runtime and the web read at start
    Value: !Ref EndpointParameter
  NextStep:
    Description: After deploy, restart the web (sudo systemctl restart <NamePrefix>-web) and use the topology tab "Neptune で編集" to seed the static data
    Value: !Sub "sudo systemctl restart ${NamePrefix}-web"
