AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  fukuda-nwc-poc - NetOps phase 1 for a closed network. Browser on the user's PC -> SSM Session Manager
  port forwarding -> chat web on EC2 (127.0.0.1 only, no inbound rules) -> AgentCore Runtime (VPC mode) ->
  Bedrock Knowledge Base (OpenSearch Serverless, hybrid search) and Bedrock Converse with a guardrail.
  No NAT gateway, no EIP, no public IP, no load balancer.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: { default: Naming }
        Parameters: [NamePrefix, Owner]
      - Label: { default: Network }
        Parameters: [VpcId, RuntimeSubnetIds, InstanceSubnetId, RouteTableIds, ClientCidr]
      - Label: { default: Agent }
        Parameters: [AgentImageUri, RuntimeName, ModelId]
      - Label: { default: Knowledge base and guardrail }
        Parameters: [KbAdminPrincipalArn, GuardrailProfileId, NumberOfResults, RerankModelId, NumberOfRerankedResults]
      - Label: { default: Chat web (EC2) }
        Parameters: [InstanceType, ImageId]
      - Label: { default: Existing VPC endpoints }
        Parameters: [CreateRuntimeEndpoints, CreateKbEndpoint, CreateSsmEndpoints, CreateAgentCoreEndpoint, CreateS3GatewayEndpoint]

Parameters:
  NamePrefix:
    Type: String
    Default: fukuda-nwc-poc
    # OpenSearch Serverless のコレクション名（NamePrefix-kb）が 28 文字までなので 25 文字に抑える
    AllowedPattern: "^[a-z][a-z0-9-]{1,24}$"
    Description: Prefix for resource names and the value of the Project tag (up to 25 characters). Same value as ecr.yaml.
  Owner:
    Type: String
    Default: fukuda
    AllowedPattern: "^[A-Za-z0-9._-]{1,64}$"
    Description: Value of the owner tag. Same value as ecr.yaml.
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: Target VPC. enableDnsSupport and enableDnsHostnames must be true.
  RuntimeSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Two or more private subnets for AgentCore Runtime, in supported AZ IDs (Tokyo apne1-az1 / apne1-az2 / apne1-az4).
  InstanceSubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: Private subnet for the chat web EC2 instance. The ssm / ssmmessages / bedrock-agentcore endpoints are placed here (1 AZ).
  RouteTableIds:
    Type: CommaDelimitedList
    Default: ""
    Description: Route tables of RuntimeSubnetIds and InstanceSubnetId, each listed once. Required only when CreateS3GatewayEndpoint is true.
  ClientCidr:
    Type: String
    Default: ""
    AllowedPattern: "^$|^([0-9]{1,3}\\.){3}[0-9]{1,3}/[0-9]{1,2}$"
    Description: Optional. Corporate CIDR whose PCs call the ssm / ssmmessages endpoints of this stack over DX or VPN. Leave empty if PCs reach AWS APIs another way.
  AgentImageUri:
    Type: String
    Description: "ECR image URI with tag, built for linux/arm64 (e.g. 123456789012.dkr.ecr.ap-northeast-1.amazonaws.com/fukuda-nwc-poc-agent:v1)"
  RuntimeName:
    Type: String
    Default: fukuda_nwc_poc_agent
    AllowedPattern: "^[a-zA-Z][a-zA-Z0-9_]{0,47}$"
    Description: AgentCore Runtime name (letters, digits and underscore only. Hyphens are not allowed).
  ModelId:
    Type: String
    Default: jp.anthropic.claude-haiku-4-5-20251001-v1:0
    Description: Bedrock model or inference profile ID. Model access must be enabled in the account.
  KbAdminPrincipalArn:
    Type: String
    AllowedPattern: "^arn:aws:iam::[0-9]{12}:(role|user)/.+$"
    Description: >-
      IAM role or user ARN whose credentials run this deployment (not an sts assumed-role ARN).
      It is added to the OpenSearch Serverless data access policy so CloudFormation can create the vector index.
      Example arn:aws:iam::123456789012:role/Admin
  GuardrailProfileId:
    Type: String
    Default: apac.guardrail.v1:0
    AllowedPattern: "^[a-z0-9-]+[.]guardrail[.]v[0-9:]+$"
    Description: System-defined guardrail profile for cross-Region inference (required by the Standard tier). apac.guardrail.v1:0 for Tokyo.
  NumberOfResults:
    Type: Number
    Default: 20
    MinValue: 1
    MaxValue: 100
    Description: Candidate chunks retrieved by the hybrid search per question (before reranking)
  RerankModelId:
    Type: String
    Default: amazon.rerank-v1:0
    # 空文字でリランクを止める
    AllowedPattern: "^$|^[a-z0-9-]+[.]rerank-v[0-9-]+:[0-9]+$"
    Description: Reranker model ID (amazon.rerank-v1:0). Leave empty to disable reranking.
  NumberOfRerankedResults:
    Type: Number
    Default: 5
    MinValue: 1
    MaxValue: 100
    Description: Chunks kept after reranking and passed to the model (ignored when RerankModelId is empty)
  InstanceType:
    Type: String
    Default: t4g.micro
    AllowedValues: [t4g.nano, t4g.micro, t4g.small]
  ImageId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-arm64
    Description: Amazon Linux 2023 arm64 (SSM Agent and AWS CLI v2 are preinstalled)
  CreateRuntimeEndpoints:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Create ecr.api / ecr.dkr / logs / bedrock-runtime interface endpoints. Set false if the VPC already has them.
  CreateKbEndpoint:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Create the bedrock-agent-runtime interface endpoint (the runtime calls Retrieve through it). Set false if the VPC already has it.
  CreateSsmEndpoints:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Create ssm / ssmmessages interface endpoints. Set false if the VPC already has them.
  CreateAgentCoreEndpoint:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Create the bedrock-agentcore interface endpoint (the chat web invokes the runtime through it). Set false if the VPC already has it.
  CreateS3GatewayEndpoint:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Create S3 gateway endpoint (free) for ECR layer download. Set false if the route tables already have one.

Conditions:
  CreateRuntimeEndpointsCond: !Equals [!Ref CreateRuntimeEndpoints, "true"]
  CreateKbEndpointCond: !Equals [!Ref CreateKbEndpoint, "true"]
  CreateSsmEndpointsCond: !Equals [!Ref CreateSsmEndpoints, "true"]
  CreateAgentCoreEndpointCond: !Equals [!Ref CreateAgentCoreEndpoint, "true"]
  CreateS3GatewayEndpointCond: !Equals [!Ref CreateS3GatewayEndpoint, "true"]
  RerankCond: !Not [!Equals [!Ref RerankModelId, ""]]
  AllowClientCond: !And
    - !Condition CreateSsmEndpointsCond
    - !Not [!Equals [!Ref ClientCidr, ""]]
  CreateAnyInterfaceEndpointCond: !Or
    - !Condition CreateRuntimeEndpointsCond
    - !Condition CreateKbEndpointCond
    - !Condition CreateSsmEndpointsCond
    - !Condition CreateAgentCoreEndpointCond

Resources:
  # ---------------------------------------------------------------- security groups
  InstanceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub ${NamePrefix}-web
      GroupDescription: Chat web EC2 - no inbound, outbound HTTPS only
      VpcId: !Ref VpcId
      # 受信ルールは置かない。ブラウザは SSM のポートフォワーディングで来る（SSM Agent が内側から ssmmessages へつなぎに行く）
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: HTTPS to VPC endpoints
      Tags:
        - { Key: Name, Value: !Sub "${NamePrefix}-web" }
        - { Key: Project, Value: !Ref NamePrefix }
        - { Key: owner, Value: !Ref Owner }

  RuntimeSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub ${NamePrefix}-runtime
      GroupDescription: AgentCore Runtime ENIs - outbound HTTPS only
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        # VPC endpoints と S3 gateway（S3 のパブリック IP 帯）へ出る。NAT が無いのでインターネットには出られない
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: HTTPS to VPC endpoints and S3 gateway endpoint
      Tags:
        - { Key: Name, Value: !Sub "${NamePrefix}-runtime" }
        - { Key: Project, Value: !Ref NamePrefix }
        - { Key: owner, Value: !Ref Owner }

  EndpointSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Condition: CreateAnyInterfaceEndpointCond
    Properties:
      GroupName: !Sub ${NamePrefix}-endpoints
      GroupDescription: Interface endpoints created by this stack - HTTPS from the chat web and the runtime
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          SourceSecurityGroupId: !Ref InstanceSecurityGroup
          Description: HTTPS from chat web EC2
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          SourceSecurityGroupId: !Ref RuntimeSecurityGroup
          Description: HTTPS from AgentCore Runtime ENIs
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: 127.0.0.1/32
          Description: No outbound
      Tags:
        - { Key: Name, Value: !Sub "${NamePrefix}-endpoints" }
        - { Key: Project, Value: !Ref NamePrefix }
        - { Key: owner, Value: !Ref Owner }

  ClientEndpointSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Condition: AllowClientCond
    Properties:
      GroupName: !Sub ${NamePrefix}-client
      GroupDescription: ssm and ssmmessages endpoints - HTTPS from corporate PCs
      VpcId: !Ref VpcId
      # 付けるのは ssm / ssmmessages だけ。利用者の PC から bedrock-agentcore や ecr のエンドポイントは見せない
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: !Ref ClientCidr
          Description: HTTPS from corporate PCs running aws ssm start-session
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: 127.0.0.1/32
          Description: No outbound
      Tags:
        - { Key: Name, Value: !Sub "${NamePrefix}-client" }
        - { Key: Project, Value: !Ref NamePrefix }
        - { Key: owner, Value: !Ref Owner }

  # ---------------------------------------------------------------- VPC endpoints for AgentCore Runtime (2 AZ)
  EcrApiEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Condition: CreateRuntimeEndpointsCond
    Properties:
      VpcId: !Ref VpcId
      ServiceName: !Sub com.amazonaws.${AWS::Region}.ecr.api
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds: !Ref RuntimeSubnetIds
      SecurityGroupIds: [!Ref EndpointSecurityGroup]
      Tags:
        - { Key: Name, Value: !Sub "${NamePrefix}-ecr-api" }
        - { Key: Project, Value: !Ref NamePrefix }
        - { Key: owner, Value: !Ref Owner }

  EcrDkrEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Condition: CreateRuntimeEndpointsCond
    Properties:
      VpcId: !Ref VpcId
      ServiceName: !Sub com.amazonaws.${AWS::Region}.ecr.dkr
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds: !Ref RuntimeSubnetIds
      SecurityGroupIds: [!Ref EndpointSecurityGroup]
      Tags:
        - { Key: Name, Value: !Sub "${NamePrefix}-ecr-dkr" }
        - { Key: Project, Value: !Ref NamePrefix }
        - { Key: owner, Value: !Ref Owner }

  LogsEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Condition: CreateRuntimeEndpointsCond
    Properties:
      VpcId: !Ref VpcId
      ServiceName: !Sub com.amazonaws.${AWS::Region}.logs
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds: !Ref RuntimeSubnetIds
      SecurityGroupIds: [!Ref EndpointSecurityGroup]
      Tags:
        - { Key: Name, Value: !Sub "${NamePrefix}-logs" }
        - { Key: Project, Value: !Ref NamePrefix }
        - { Key: owner, Value: !Ref Owner }

  BedrockRuntimeEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Condition: CreateRuntimeEndpointsCond
    Properties:
      VpcId: !Ref VpcId
      ServiceName: !Sub com.amazonaws.${AWS::Region}.bedrock-runtime
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds: !Ref RuntimeSubnetIds
      SecurityGroupIds: [!Ref EndpointSecurityGroup]
      Tags:
        - { Key: Name, Value: !Sub "${NamePrefix}-bedrock-runtime" }
        - { Key: Project, Value: !Ref NamePrefix }
        - { Key: owner, Value: !Ref Owner }

  BedrockAgentRuntimeEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Condition: CreateKbEndpointCond
    Properties:
      VpcId: !Ref VpcId
      ServiceName: !Sub com.amazonaws.${AWS::Region}.bedrock-agent-runtime
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds: !Ref RuntimeSubnetIds
      SecurityGroupIds: [!Ref EndpointSecurityGroup]
      Tags:
        - { Key: Name, Value: !Sub "${NamePrefix}-bedrock-agent-runtime" }
        - { Key: Project, Value: !Ref NamePrefix }
        - { Key: owner, Value: !Ref Owner }

  S3GatewayEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Condition: CreateS3GatewayEndpointCond
    Properties:
      VpcId: !Ref VpcId
      ServiceName: !Sub com.amazonaws.${AWS::Region}.s3
      VpcEndpointType: Gateway
      RouteTableIds: !Ref RouteTableIds
      # ECR のレイヤー置き場（Runtime のイメージ取得）と AL2023 の dnf リポジトリ（EC2 に python3.13 を入れる）だけを許す。
      # 同じルートテーブルを使う他のワークロードの S3 アクセスもこの制限を受けるので、専用サブネットを推奨
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AllowECRLayerAccess
            Effect: Allow
            Principal: "*"
            Action: s3:GetObject
            Resource: !Sub arn:${AWS::Partition}:s3:::prod-${AWS::Region}-starport-layer-bucket/*
          - Sid: AllowAL2023Repos
            Effect: Allow
            Principal: "*"
            Action: s3:GetObject
            Resource: !Sub arn:${AWS::Partition}:s3:::al2023-repos-${AWS::Region}-de612dc2/*
      Tags:
        - { Key: Name, Value: !Sub "${NamePrefix}-s3" }
        - { Key: Project, Value: !Ref NamePrefix }
        - { Key: owner, Value: !Ref Owner }

  # ---------------------------------------------------------------- VPC endpoints for the chat web EC2 (1 AZ)
  SsmEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Condition: CreateSsmEndpointsCond
    Properties:
      VpcId: !Ref VpcId
      ServiceName: !Sub com.amazonaws.${AWS::Region}.ssm
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds: [!Ref InstanceSubnetId]
      SecurityGroupIds: !If
        - AllowClientCond
        - [!Ref EndpointSecurityGroup, !Ref ClientEndpointSecurityGroup]
        - [!Ref EndpointSecurityGroup]
      Tags:
        - { Key: Name, Value: !Sub "${NamePrefix}-ssm" }
        - { Key: Project, Value: !Ref NamePrefix }
        - { Key: owner, Value: !Ref Owner }

  SsmMessagesEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Condition: CreateSsmEndpointsCond
    Properties:
      VpcId: !Ref VpcId
      ServiceName: !Sub com.amazonaws.${AWS::Region}.ssmmessages
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds: [!Ref InstanceSubnetId]
      SecurityGroupIds: !If
        - AllowClientCond
        - [!Ref EndpointSecurityGroup, !Ref ClientEndpointSecurityGroup]
        - [!Ref EndpointSecurityGroup]
      Tags:
        - { Key: Name, Value: !Sub "${NamePrefix}-ssmmessages" }
        - { Key: Project, Value: !Ref NamePrefix }
        - { Key: owner, Value: !Ref Owner }

  AgentCoreEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Condition: CreateAgentCoreEndpointCond
    Properties:
      VpcId: !Ref VpcId
      ServiceName: !Sub com.amazonaws.${AWS::Region}.bedrock-agentcore
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds: [!Ref InstanceSubnetId]
      SecurityGroupIds: [!Ref EndpointSecurityGroup]
      Tags:
        - { Key: Name, Value: !Sub "${NamePrefix}-bedrock-agentcore" }
        - { Key: Project, Value: !Ref NamePrefix }
        - { Key: owner, Value: !Ref Owner }

  # ---------------------------------------------------------------- knowledge base (S3 -> Titan Embeddings v2 -> OpenSearch Serverless)
  # 取り込み元の md を置くバケット。利用者の PC から aws s3 cp で置き、start-ingestion-job で取り込む（README の手順 4）
  KbBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub ${NamePrefix}-kb-${AWS::AccountId}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      Tags:
        - { Key: Name, Value: !Sub "${NamePrefix}-kb" }
        - { Key: Project, Value: !Ref NamePrefix }
        - { Key: owner, Value: !Ref Owner }

  KbBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref KbBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt KbBucket.Arn
              - !Sub ${KbBucket.Arn}/*
            Condition:
              Bool:
                aws:SecureTransport: "false"

  KbEncryptionPolicy:
    Type: AWS::OpenSearchServerless::SecurityPolicy
    Properties:
      Name: !Sub ${NamePrefix}-kb
      Type: encryption
      Description: AWS owned key for the knowledge base collection
      Policy: !Sub '{"Rules":[{"ResourceType":"collection","Resource":["collection/${NamePrefix}-kb"]}],"AWSOwnedKey":true}'

  KbNetworkPolicy:
    Type: AWS::OpenSearchServerless::SecurityPolicy
    Properties:
      Name: !Sub ${NamePrefix}-kb
      Type: network
      Description: Collection endpoint reachable over the public AWS endpoint, data access limited by the access policy
      # Runtime はコレクションを直接呼ばない（Retrieve を呼ぶと Bedrock がサービス側から検索する）。
      # 非公開（SourceVPCEs / SourceServices）にすると CloudFormation のインデックス作成が通るか確認できていないので、公開にしてデータアクセスポリシーで絞る
      Policy: !Sub '[{"Rules":[{"ResourceType":"collection","Resource":["collection/${NamePrefix}-kb"]}],"AllowFromPublic":true}]'

  KbAccessPolicy:
    Type: AWS::OpenSearchServerless::AccessPolicy
    Properties:
      Name: !Sub ${NamePrefix}-kb
      Type: data
      Description: Knowledge base service role and the deployer only
      Policy: !Sub >-
        [{"Rules":[
        {"ResourceType":"collection","Resource":["collection/${NamePrefix}-kb"],
        "Permission":["aoss:CreateCollectionItems","aoss:DescribeCollectionItems","aoss:UpdateCollectionItems"]},
        {"ResourceType":"index","Resource":["index/${NamePrefix}-kb/*"],
        "Permission":["aoss:CreateIndex","aoss:DescribeIndex","aoss:UpdateIndex","aoss:DeleteIndex","aoss:ReadDocument","aoss:WriteDocument"]}],
        "Principal":["${KbRole.Arn}","${KbAdminPrincipalArn}"]}]

  KbCollection:
    Type: AWS::OpenSearchServerless::Collection
    # アクセスポリシーも先に作る。反映に 1 分ほどかかるので、コレクションの作成（数分）の間に効かせてからインデックスを作る
    DependsOn: [KbEncryptionPolicy, KbNetworkPolicy, KbAccessPolicy]
    Properties:
      Name: !Sub ${NamePrefix}-kb
      Type: VECTORSEARCH
      Description: fukuda-nwc-poc knowledge base
      # スタンバイを切ると最小 OCU が半分になる（検証用。可用性は下がる）
      StandbyReplicas: DISABLED
      Tags:
        - { Key: Name, Value: !Sub "${NamePrefix}-kb" }
        - { Key: Project, Value: !Ref NamePrefix }
        - { Key: owner, Value: !Ref Owner }

  KbIndex:
    Type: AWS::OpenSearchServerless::Index
    Properties:
      CollectionEndpoint: !GetAtt KbCollection.CollectionEndpoint
      IndexName: kb-index
      Settings:
        Index:
          Knn: true
      Mappings:
        Properties:
          # ハイブリッド検索は faiss エンジンと、index が true の text フィールドが要る
          bedrock-kb-vector:
            Type: knn_vector
            Dimension: 1024
            Method:
              Engine: faiss
              Name: hnsw
              SpaceType: l2
              Parameters:
                EfConstruction: 128
                M: 24
          AMAZON_BEDROCK_TEXT_CHUNK:
            Type: text
            Index: true
          AMAZON_BEDROCK_METADATA:
            Type: text
            Index: false

  KbRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${NamePrefix}-kb
      Description: Service role for the fukuda-nwc-poc Bedrock knowledge base
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: bedrock.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnLike:
                aws:SourceArn: !Sub arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:knowledge-base/*
      Policies:
        - PolicyName: kb
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ListModels
                Effect: Allow
                Action: [bedrock:ListFoundationModels, bedrock:ListCustomModels]
                Resource: "*"
              - Sid: Embedding
                Effect: Allow
                Action: bedrock:InvokeModel
                Resource: !Sub arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/amazon.titan-embed-text-v2:0
              # Retrieve のリランクは呼び出し側ではなく KB のサービスロールの権限で動く
              - !If
                - RerankCond
                - Sid: Rerank
                  Effect: Allow
                  Action: bedrock:Rerank
                  Resource: "*"
                - !Ref AWS::NoValue
              - !If
                - RerankCond
                - Sid: RerankModel
                  Effect: Allow
                  Action: bedrock:InvokeModel
                  Resource: !Sub arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/${RerankModelId}
                - !Ref AWS::NoValue
              - Sid: S3List
                Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt KbBucket.Arn
                Condition:
                  StringEquals:
                    aws:ResourceAccount: !Ref AWS::AccountId
              - Sid: S3Read
                Effect: Allow
                Action: s3:GetObject
                Resource: !Sub ${KbBucket.Arn}/*
                Condition:
                  StringEquals:
                    aws:ResourceAccount: !Ref AWS::AccountId
              - Sid: OpenSearch
                Effect: Allow
                Action: aoss:APIAccessAll
                # コレクションの ARN は名前でなく ID で決まり、GetAtt するとアクセスポリシーと循環するのでアカウント内に絞る。
                # 中身に触れるかはデータアクセスポリシー（KbAccessPolicy）が決める
                Resource: !Sub arn:${AWS::Partition}:aoss:${AWS::Region}:${AWS::AccountId}:collection/*
      Tags:
        - { Key: Name, Value: !Sub "${NamePrefix}-kb" }
        - { Key: Project, Value: !Ref NamePrefix }
        - { Key: owner, Value: !Ref Owner }

  KnowledgeBase:
    Type: AWS::Bedrock::KnowledgeBase
    DependsOn: KbIndex
    Properties:
      Name: !Sub ${NamePrefix}-kb
      Description: fukuda-nwc-poc runbooks (markdown)
      RoleArn: !GetAtt KbRole.Arn
      KnowledgeBaseConfiguration:
        Type: VECTOR
        VectorKnowledgeBaseConfiguration:
          EmbeddingModelArn: !Sub arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/amazon.titan-embed-text-v2:0
      StorageConfiguration:
        Type: OPENSEARCH_SERVERLESS
        OpensearchServerlessConfiguration:
          CollectionArn: !GetAtt KbCollection.Arn
          VectorIndexName: kb-index
          FieldMapping:
            VectorField: bedrock-kb-vector
            TextField: AMAZON_BEDROCK_TEXT_CHUNK
            MetadataField: AMAZON_BEDROCK_METADATA
      Tags:
        Name: !Sub ${NamePrefix}-kb
        Project: !Ref NamePrefix
        owner: !Ref Owner

  KbDataSource:
    Type: AWS::Bedrock::DataSource
    Properties:
      KnowledgeBaseId: !GetAtt KnowledgeBase.KnowledgeBaseId
      Name: !Sub ${NamePrefix}-docs
      Description: Markdown files under s3://<bucket>/docs/
      # DELETE だとスタック削除時にベクトルの削除が走り、コレクションが先に消えると失敗する。RETAIN にしてコレクションごと消す
      DataDeletionPolicy: RETAIN
      DataSourceConfiguration:
        Type: S3
        S3Configuration:
          BucketArn: !GetAtt KbBucket.Arn
          InclusionPrefixes: [docs/]

  # ---------------------------------------------------------------- guardrail
  Guardrail:
    Type: AWS::Bedrock::Guardrail
    Properties:
      Name: !Sub ${NamePrefix}-guardrail
      Description: fukuda-nwc-poc content filters and prompt attack filter
      BlockedInputMessaging: この質問にはお答えできません。業務に関する内容で聞き直してください。
      BlockedOutputsMessaging: 回答にガードレールで止める内容が含まれたため、表示しません。聞き方を変えてください。
      # Classic 階層は英語・フランス語・スペイン語だけ。日本語を判定させるには Standard 階層にする。
      # Standard 階層はクロスリージョン推論が必須で、判定は APAC の他リージョンで行われることがある
      CrossRegionConfig:
        GuardrailProfileArn: !Sub arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:guardrail-profile/${GuardrailProfileId}
      ContentPolicyConfig:
        ContentFiltersTierConfig:
          TierName: STANDARD
        FiltersConfig:
          # ネットワーク運用の語（攻撃・遮断・kill など）で誤検知しにくいよう MEDIUM にする
          - { Type: HATE, InputStrength: MEDIUM, OutputStrength: MEDIUM }
          - { Type: INSULTS, InputStrength: MEDIUM, OutputStrength: MEDIUM }
          - { Type: SEXUAL, InputStrength: MEDIUM, OutputStrength: MEDIUM }
          - { Type: VIOLENCE, InputStrength: MEDIUM, OutputStrength: MEDIUM }
          - { Type: MISCONDUCT, InputStrength: MEDIUM, OutputStrength: MEDIUM }
          # プロンプト攻撃は入力だけに効く。出力側は NONE にする決まり
          - { Type: PROMPT_ATTACK, InputStrength: HIGH, OutputStrength: NONE }
      Tags:
        - { Key: Name, Value: !Sub "${NamePrefix}-guardrail" }
        - { Key: Project, Value: !Ref NamePrefix }
        - { Key: owner, Value: !Ref Owner }

  # 版は作成時点のガードレールを固定する。ガードレールを変えたら Description の r1 を r2 に上げて、版を作り直させる
  GuardrailVersion:
    Type: AWS::Bedrock::GuardrailVersion
    Properties:
      GuardrailIdentifier: !GetAtt Guardrail.GuardrailId
      Description: fukuda-nwc-poc r1

  # ---------------------------------------------------------------- AgentCore Runtime
  RuntimeRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${NamePrefix}-runtime
      Description: Execution role for the fukuda-nwc-poc AgentCore Runtime
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: bedrock-agentcore.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
              ArnLike:
                aws:SourceArn: !Sub arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:*
      Policies:
        - PolicyName: runtime
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: EcrPull
                Effect: Allow
                Action: [ecr:BatchGetImage, ecr:GetDownloadUrlForLayer]
                Resource: !Sub arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/${NamePrefix}-*
              - Sid: EcrToken
                Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Sid: LogsGroup
                Effect: Allow
                Action: [logs:DescribeLogStreams, logs:CreateLogGroup]
                Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/bedrock-agentcore/runtimes/*
              - Sid: LogsDescribe
                Effect: Allow
                Action: logs:DescribeLogGroups
                Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:*
              - Sid: LogsWrite
                Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/bedrock-agentcore/runtimes/*:log-stream:*
              - Sid: Xray
                Effect: Allow
                Action: [xray:PutTraceSegments, xray:PutTelemetryRecords, xray:GetSamplingRules, xray:GetSamplingTargets]
                Resource: "*"
              - Sid: Metrics
                Effect: Allow
                Action: cloudwatch:PutMetricData
                Resource: "*"
                Condition:
                  StringEquals:
                    cloudwatch:namespace: bedrock-agentcore
              - Sid: WorkloadToken
                Effect: Allow
                Action: [bedrock-agentcore:GetWorkloadAccessToken, bedrock-agentcore:GetWorkloadAccessTokenForJWT]
                Resource:
                  - !Sub arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:workload-identity-directory/default
                  - !Sub arn:${AWS::Partition}:bedrock-agentcore:${AWS::Region}:${AWS::AccountId}:workload-identity-directory/default/workload-identity/${RuntimeName}-*
              - Sid: BedrockInvoke
                Effect: Allow
                Action: [bedrock:InvokeModel, bedrock:InvokeModelWithResponseStream]
                Resource:
                  # jp.* の推論プロファイルは東京と大阪のモデルへ振り分けるので、リージョンは * にする
                  - !Sub arn:${AWS::Partition}:bedrock:*::foundation-model/*
                  - !Sub arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/*
              - Sid: KbRetrieve
                Effect: Allow
                Action: bedrock:Retrieve
                Resource: !GetAtt KnowledgeBase.KnowledgeBaseArn
              - Sid: ApplyGuardrail
                Effect: Allow
                Action: bedrock:ApplyGuardrail
                Resource:
                  - !GetAtt Guardrail.GuardrailArn
                  # Standard 階層の判定はプロファイルの行き先リージョンで行われるので、リージョンは * にする
                  - !Sub arn:${AWS::Partition}:bedrock:*:${AWS::AccountId}:guardrail-profile/${GuardrailProfileId}
      Tags:
        - { Key: Name, Value: !Sub "${NamePrefix}-runtime" }
        - { Key: Project, Value: !Ref NamePrefix }
        - { Key: owner, Value: !Ref Owner }

  AgentRuntime:
    Type: AWS::BedrockAgentCore::Runtime
    Properties:
      AgentRuntimeName: !Ref RuntimeName
      Description: fukuda-nwc-poc chat agent
      RoleArn: !GetAtt RuntimeRole.Arn
      AgentRuntimeArtifact:
        ContainerConfiguration:
          ContainerUri: !Ref AgentImageUri
      NetworkConfiguration:
        NetworkMode: VPC
        NetworkModeConfig:
          Subnets: !Ref RuntimeSubnetIds
          SecurityGroups: [!Ref RuntimeSecurityGroup]
      ProtocolConfiguration: HTTP
      LifecycleConfiguration:
        # 放置したセッションを 5 分で畳む（メモリ課金を止める）。1 セッションの寿命は最大 1 時間
        IdleRuntimeSessionTimeout: 300
        MaxLifetime: 3600
      EnvironmentVariables:
        MODEL_ID: !Ref ModelId
        BEDROCK_REGION: !Ref AWS::Region
        KNOWLEDGE_BASE_ID: !GetAtt KnowledgeBase.KnowledgeBaseId
        NUMBER_OF_RESULTS: !Ref NumberOfResults
        RERANK_MODEL_ARN: !If
          - RerankCond
          - !Sub arn:${AWS::Partition}:bedrock:${AWS::Region}::foundation-model/${RerankModelId}
          - !Ref AWS::NoValue
        NUMBER_OF_RERANKED_RESULTS: !Ref NumberOfRerankedResults
        GUARDRAIL_ID: !GetAtt Guardrail.GuardrailId
        GUARDRAIL_VERSION: !GetAtt GuardrailVersion.Version
      Tags:
        Name: !Sub ${NamePrefix}-agent
        Project: !Ref NamePrefix
        owner: !Ref Owner
        # 参照を置いて、VPC endpoints ができてから Runtime を作らせる（条件付きリソースに DependsOn は書けない）
        RuntimeEndpoints: !If [CreateRuntimeEndpointsCond, !Join ["/", [!Ref EcrApiEndpoint, !Ref EcrDkrEndpoint, !Ref LogsEndpoint, !Ref BedrockRuntimeEndpoint]], existing]
        S3GatewayEndpoint: !If [CreateS3GatewayEndpointCond, !Ref S3GatewayEndpoint, existing]
        KbEndpoint: !If [CreateKbEndpointCond, !Ref BedrockAgentRuntimeEndpoint, existing]

  # ---------------------------------------------------------------- chat web EC2
  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${NamePrefix}-web
      Description: fukuda-nwc-poc chat web EC2 - SSM managed node and invoke the AgentCore Runtime only
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: invoke-runtime
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: bedrock-agentcore:InvokeAgentRuntime
                Resource:
                  - !GetAtt AgentRuntime.AgentRuntimeArn
                  - !Sub ${AgentRuntime.AgentRuntimeArn}/*
      Tags:
        - { Key: Name, Value: !Sub "${NamePrefix}-web" }
        - { Key: Project, Value: !Ref NamePrefix }
        - { Key: owner, Value: !Ref Owner }

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Sub ${NamePrefix}-web
      Roles: [!Ref InstanceRole]

  WebInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref ImageId
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref InstanceProfile
      NetworkInterfaces:
        - DeviceIndex: "0"
          SubnetId: !Ref InstanceSubnetId
          GroupSet: [!Ref InstanceSecurityGroup]
          AssociatePublicIpAddress: false
      MetadataOptions:
        HttpEndpoint: enabled
        HttpTokens: required
        HttpPutResponseHopLimit: 1
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeType: gp3
            VolumeSize: 8
            Encrypted: true
            DeleteOnTermination: true
      PropagateTagsToVolumeOnCreation: true
      Tags:
        - { Key: Name, Value: !Sub "${NamePrefix}-web" }
        - { Key: Project, Value: !Ref NamePrefix }
        - { Key: owner, Value: !Ref Owner }
      # UserData を変えると CloudFormation はインスタンスを停止・起動する。
      # 先頭の cloud-config で起動のたびにスクリプトを流すので、変更はその再起動で反映される。
      # 本文は Fn::Sub を通るので、画面とサーバのコードに「ドル記号 + 波かっこ」を書かない
      UserData:
        Fn::Base64: !Sub |
          Content-Type: multipart/mixed; boundary="==BOUNDARY=="
          MIME-Version: 1.0

          --==BOUNDARY==
          Content-Type: text/cloud-config; charset="us-ascii"
          MIME-Version: 1.0

          #cloud-config
          cloud_final_modules:
          - [scripts-user, always]

          --==BOUNDARY==
          Content-Type: text/x-shellscript; charset="utf-8"
          MIME-Version: 1.0
          Content-Transfer-Encoding: 8bit

          #!/bin/bash
          set -euo pipefail
          # /usr/bin/python3 は 3.9 のまま（AL2023 の仕様）。3.13 を別に入れる。取得経路は S3 ゲートウェイエンドポイント
          command -v python3.13 >/dev/null || dnf install -y python3.13
          install -d -m 0755 /opt/${NamePrefix}-web

          cat > /etc/${NamePrefix}-web.env <<'__ENV__'
          RUNTIME_ARN=${AgentRuntime.AgentRuntimeArn}
          AWS_REGION=${AWS::Region}
          PORT=8080
          __ENV__

          cat > /etc/systemd/system/${NamePrefix}-web.service <<'__UNIT__'
          [Unit]
          Description=${NamePrefix} chat web (127.0.0.1:8080, reached via SSM port forwarding)
          After=network-online.target
          Wants=network-online.target

          [Service]
          EnvironmentFile=/etc/${NamePrefix}-web.env
          ExecStart=/usr/bin/python3.13 /opt/${NamePrefix}-web/server.py
          DynamicUser=yes
          StateDirectory=${NamePrefix}-web
          Environment=HOME=/var/lib/${NamePrefix}-web
          NoNewPrivileges=yes
          ProtectSystem=strict
          ProtectHome=yes
          PrivateTmp=yes
          PrivateDevices=yes
          Restart=on-failure
          RestartSec=5

          [Install]
          WantedBy=multi-user.target
          __UNIT__

          cat > /opt/${NamePrefix}-web/index.html <<'__INDEX_HTML__'
          <!doctype html>
          <html lang="ja">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>NWC PoC チャット</title>
          <style>
            body { font-family: system-ui, -apple-system, "Hiragino Sans", "Yu Gothic UI", sans-serif; margin: 0; background: #f6f7f9; color: #1b1f24; }
            main { max-width: 760px; margin: 0 auto; padding: 16px; display: flex; flex-direction: column; height: 100vh; box-sizing: border-box; }
            h1 { font-size: 18px; margin: 0 0 8px; }
            #log { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding: 8px 0; }
            .msg { padding: 10px 12px; border-radius: 8px; white-space: pre-wrap; line-height: 1.6; max-width: 85%; }
            .user { align-self: flex-end; background: #dbeafe; }
            .agent { align-self: flex-start; background: #fff; border: 1px solid #d0d7de; }
            .error { align-self: flex-start; background: #fee2e2; }
            form { display: flex; gap: 8px; }
            textarea { flex: 1; resize: vertical; min-height: 52px; padding: 8px; font: inherit; }
            button { padding: 0 18px; font: inherit; }
          </style>
          </head>
          <body>
          <main>
            <h1>NWC PoC チャット</h1>
            <div id="log" aria-live="polite"></div>
            <form id="form">
              <textarea id="prompt" placeholder="質問を入力（Ctrl+Enter で送信）" maxlength="4000" required></textarea>
              <button id="send">送信</button>
            </form>
          </main>
          <script>
          (() => {
            const log = document.getElementById("log");
            const form = document.getElementById("form");
            const input = document.getElementById("prompt");
            const send = document.getElementById("send");
            // 36 文字。runtimeSessionId は 33 文字以上。localhost は安全なコンテキストなので randomUUID が使える
            const sessionId = crypto.randomUUID();
            // 応答は textContent で入れる（HTML として解釈しない）
            const add = (cls, text) => {
              const div = document.createElement("div");
              div.className = "msg " + cls;
              div.textContent = text;
              log.appendChild(div);
              log.scrollTop = log.scrollHeight;
              return div;
            };
            input.addEventListener("keydown", (e) => {
              if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) form.requestSubmit();
            });
            form.addEventListener("submit", async (e) => {
              e.preventDefault();
              const prompt = input.value.trim();
              if (!prompt) return;
              add("user", prompt);
              input.value = "";
              send.disabled = true;
              const pending = add("agent", "…");
              try {
                const res = await fetch("/chat", {
                  method: "POST",
                  headers: { "Content-Type": "application/json" },
                  body: JSON.stringify({ prompt, session_id: sessionId }),
                });
                const data = await res.json().catch(() => ({}));
                if (!res.ok) throw new Error(data.message || "HTTP " + res.status);
                pending.textContent = data.response;
              } catch (err) {
                pending.className = "msg error";
                pending.textContent = "エラー: " + err.message;
              } finally {
                send.disabled = false;
                input.focus();
              }
            });
          })();
          </script>
          </body>
          </html>
          __INDEX_HTML__

          cat > /opt/${NamePrefix}-web/server.py <<'__SERVER_PY__'
          """Chat web. Listens on 127.0.0.1 only; users reach it through SSM port forwarding.

          Python 3.13, standard library only (no internet here, so no pip). The runtime is invoked with the
          preinstalled AWS CLI v2, which signs the request with the instance role.
          """
          import json
          import logging
          import os
          import re
          import subprocess
          import tempfile
          from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

          ARN = os.environ["RUNTIME_ARN"]
          REGION = os.environ["AWS_REGION"]
          PORT = int(os.environ.get("PORT", "8080"))
          with open(os.path.join(os.path.dirname(os.path.abspath(__file__)), "index.html"), "rb") as f:
              INDEX = f.read()
          SESSION_RE = re.compile(r"^[A-Za-z0-9-]{33,100}$")
          # DNS rebinding 対策。ポートフォワード経由の localhost 以外の Host は断る
          HOST_RE = re.compile(r"^(localhost|127\.0\.0\.1|\[::1\])(:[0-9]{1,5})?$")
          CSP = "default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'self'"
          logging.basicConfig(level=logging.INFO, format="%(levelname)s %(message)s")
          log = logging.getLogger("web")


          def invoke(prompt, session_id):
              with tempfile.TemporaryDirectory() as tmp:
                  src = os.path.join(tmp, "in.json")
                  dst = os.path.join(tmp, "out.json")
                  with open(src, "w", encoding="utf-8") as f:
                      json.dump({"prompt": prompt}, f, ensure_ascii=False)
                  cmd = [
                      "aws", "bedrock-agentcore", "invoke-agent-runtime",
                      "--region", REGION,
                      "--agent-runtime-arn", ARN,
                      "--runtime-session-id", session_id,
                      "--qualifier", "DEFAULT",
                      "--content-type", "application/json",
                      "--accept", "application/json",
                      "--payload", "fileb://" + src,
                      "--cli-read-timeout", "120",
                      "--output", "json",
                      dst,
                  ]
                  try:
                      proc = subprocess.run(cmd, capture_output=True, text=True, timeout=150)
                  except subprocess.TimeoutExpired:
                      log.error("invoke timed out")
                      return 504, {"message": "エージェントの応答が時間内に返りませんでした"}
                  if proc.returncode != 0:
                      log.error("invoke failed: %s", proc.stderr.strip()[-2000:])
                      return 502, {"message": "エージェントの呼び出しに失敗しました"}
                  try:
                      with open(dst, encoding="utf-8") as f:
                          data = json.load(f)
                  except (OSError, ValueError):
                      log.exception("unreadable agent response")
                      return 502, {"message": "エージェントの応答を読めませんでした"}
              if not isinstance(data, dict) or data.get("status") != "success":
                  log.error("agent error: %s", str(data)[:500])
                  return 502, {"message": "エージェントがエラーを返しました"}
              return 200, {"response": data.get("response", "")}


          class Handler(BaseHTTPRequestHandler):
              server_version = "chat"
              sys_version = ""

              def reply(self, code, body, ctype="application/json; charset=utf-8"):
                  if not isinstance(body, bytes):
                      body = json.dumps(body, ensure_ascii=False).encode("utf-8")
                  self.send_response(code)
                  self.send_header("Content-Type", ctype)
                  self.send_header("Content-Length", str(len(body)))
                  self.send_header("Cache-Control", "no-store")
                  self.send_header("X-Content-Type-Options", "nosniff")
                  self.send_header("X-Frame-Options", "DENY")
                  self.send_header("Content-Security-Policy", CSP)
                  self.end_headers()
                  self.wfile.write(body)

              def host_ok(self):
                  if HOST_RE.match(self.headers.get("Host", "")):
                      return True
                  self.reply(403, {"message": "http://localhost:<ポート>/ で開いてください"})
                  return False

              def do_GET(self):
                  if not self.host_ok():
                      return
                  if self.path in ("/", "/index.html"):
                      self.reply(200, INDEX, "text/html; charset=utf-8")
                  else:
                      self.reply(404, {"message": "not found"})

              def do_POST(self):
                  if not self.host_ok():
                      return
                  if self.path != "/chat":
                      return self.reply(404, {"message": "not found"})
                  # 別サイトからの単純な POST（text/plain など）を通さない。application/json はプリフライトが要る
                  if not self.headers.get("Content-Type", "").startswith("application/json"):
                      return self.reply(415, {"message": "application/json で送ってください"})
                  try:
                      length = int(self.headers.get("Content-Length") or 0)
                  except ValueError:
                      length = 0
                  if not 0 < length <= 20000:
                      return self.reply(413, {"message": "本文が空か大きすぎます"})
                  try:
                      body = json.loads(self.rfile.read(length))
                  except ValueError:
                      return self.reply(400, {"message": "JSON が不正です"})
                  if not isinstance(body, dict):
                      return self.reply(400, {"message": "JSON オブジェクトで送ってください"})
                  prompt = body.get("prompt")
                  session_id = body.get("session_id")
                  if not isinstance(prompt, str) or not prompt.strip() or len(prompt) > 4000:
                      return self.reply(400, {"message": "prompt は 1〜4000 文字"})
                  if not isinstance(session_id, str) or not SESSION_RE.match(session_id):
                      return self.reply(400, {"message": "session_id が不正です"})
                  code, result = invoke(prompt, session_id)
                  self.reply(code, result)


          if __name__ == "__main__":
              ThreadingHTTPServer(("127.0.0.1", PORT), Handler).serve_forever()
          __SERVER_PY__

          systemctl daemon-reload
          systemctl enable ${NamePrefix}-web.service
          systemctl restart ${NamePrefix}-web.service
          --==BOUNDARY==--

Outputs:
  WebInstanceId:
    Description: Target of the SSM port forwarding session
    Value: !Ref WebInstance
  StartSessionCommand:
    Description: Run on the user's PC (AWS CLI v2 + Session Manager plugin, macOS / Linux quoting), keep it running, then open ChatUrl
    Value: !Sub >-
      aws ssm start-session --region ${AWS::Region} --target ${WebInstance}
      --document-name AWS-StartPortForwardingSession
      --parameters '{"portNumber":["8080"],"localPortNumber":["8080"]}'
  ChatUrl:
    Description: Open in the browser while the session above is running
    Value: http://localhost:8080/
  AgentRuntimeArn:
    Value: !GetAtt AgentRuntime.AgentRuntimeArn
  AgentRuntimeId:
    Value: !GetAtt AgentRuntime.AgentRuntimeId
  RuntimeLogGroupName:
    Description: Created by AgentCore, not by this stack. Set retention and the Project tag by hand (README step 4).
    Value: !Sub /aws/bedrock-agentcore/runtimes/${AgentRuntime.AgentRuntimeId}-DEFAULT
  InstanceSecurityGroupId:
    Description: Allow 443 from this SG on existing ssm / ssmmessages / bedrock-agentcore endpoints
    Value: !Ref InstanceSecurityGroup
  RuntimeSecurityGroupId:
    Description: Allow 443 from this SG on existing ecr / logs / bedrock-runtime / bedrock-agent-runtime endpoints
    Value: !Ref RuntimeSecurityGroup
  KbBucketName:
    Value: !Ref KbBucket
  UploadDocsCommand:
    Description: Run in this repository to upload the sample markdown files
    Value: !Sub aws s3 cp kb-docs/ s3://${KbBucket}/docs/ --recursive --exclude "*" --include "*.md"
  StartIngestionCommand:
    Description: Run after uploading or changing the files. The knowledge base does not sync by itself.
    Value: !Sub aws bedrock-agent start-ingestion-job --region ${AWS::Region} --knowledge-base-id ${KnowledgeBase.KnowledgeBaseId} --data-source-id ${KbDataSource.DataSourceId}
  KnowledgeBaseId:
    Value: !GetAtt KnowledgeBase.KnowledgeBaseId
  DataSourceId:
    Value: !GetAtt KbDataSource.DataSourceId
  CollectionEndpoint:
    Value: !GetAtt KbCollection.CollectionEndpoint
  GuardrailId:
    Value: !GetAtt Guardrail.GuardrailId
  GuardrailVersion:
    Value: !GetAtt GuardrailVersion.Version
