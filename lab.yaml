AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  fukuda-nwc-poc - optional lab stack. One EC2 (Amazon Linux 2023 arm64) runs Docker + containerlab with the wvs2 topology
  (6 FRR routers with BGP, 4 snmpd sidecars, 4 hosts, all fictional addresses). Reached with SSM Session Manager.
  Images come from ECR (ecr.yaml), the containerlab rpm and configs from the S3 bucket of main.yaml. Stop the instance when not in use.
  Phase 2: if the Telegraf rpm is also in lab/, Telegraf polls the CE routers over SNMP, receives their traps and writes to MSK (stream.yaml).

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: { default: Naming }
        Parameters: [NamePrefix, Owner]
      - Label: { default: Network (same VPC as main.yaml) }
        Parameters: [VpcId, SubnetId, EndpointSecurityGroupId]
      - Label: { default: Lab EC2 }
        Parameters: [InstanceType, ImageId, VolumeSize, AutoStartLab]
      - Label: { default: Assets }
        Parameters: [AssetBucketName, ContainerlabVersion, TelegrafVersion, FrrImageTag, SnmpdImageTag, MultitoolImageTag]

Parameters:
  NamePrefix:
    Type: String
    Default: fukuda-nwc-poc
    AllowedPattern: "^[a-z][a-z0-9-]{1,24}$"
    Description: Same value as ecr.yaml / main.yaml (ECR repository names are derived from it)
  Owner:
    Type: String
    Default: fukuda
    AllowedPattern: "^[A-Za-z0-9._-]{1,64}$"
    Description: Value of the owner tag
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: The VPC of main.yaml
  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: Private subnet for the lab EC2. Its route table must have the S3 gateway endpoint (RouteTableIds of main.yaml)
  EndpointSecurityGroupId:
    Type: String
    Default: ""
    AllowedPattern: "^$|^sg-[0-9a-f]{8,17}$"
    Description: >-
      EndpointSecurityGroupId output of main.yaml. An ingress rule (443 from the lab EC2) is added to it so the instance can reach
      the ssm / ssmmessages / ecr.api / ecr.dkr endpoints. Leave empty if the VPC already has endpoints that allow the lab SG (add the rule by hand).
  InstanceType:
    Type: String
    Default: t4g.large
    AllowedValues: [t4g.medium, t4g.large, t4g.xlarge]
    Description: 14 containers (FRR x6, snmpd x4, hosts x4). t4g.large (2 vCPU / 8 GB) is comfortable; t4g.medium (4 GB) works but leaves little room.
  ImageId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-arm64
    Description: Amazon Linux 2023 arm64 (SSM Agent and AWS CLI v2 are preinstalled; Docker comes from the AL2023 repository)
  VolumeSize:
    Type: Number
    Default: 16
    MinValue: 8
    MaxValue: 64
    Description: Root volume in GB (Docker images are about 400 MB)
  AutoStartLab:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Deploy the topology at every boot (systemd unit). Set false to start it by hand with "sudo lab up".
  AssetBucketName:
    Type: String
    AllowedPattern: "^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$"
    Description: KbBucketName output of main.yaml. The instance reads lab/ from it (README lab step 2).
  ContainerlabVersion:
    Type: String
    Default: 0.79.0
    AllowedPattern: "^[0-9]+[.][0-9]+[.][0-9]+$"
    Description: containerlab_<version>_linux_arm64.rpm must be uploaded to s3://<AssetBucketName>/lab/
  TelegrafVersion:
    Type: String
    Default: 1.40.0
    AllowedPattern: "^[0-9]+[.][0-9]+[.][0-9]+$"
    Description: Phase 2. telegraf-<version>-1.aarch64.rpm in s3://<AssetBucketName>/lab/ is installed when present (README stream step 1). Nothing happens without it.
  FrrImageTag:
    Type: String
    Default: 10.2.1
    Description: Tag pushed to <NamePrefix>-lab-frr
  SnmpdImageTag:
    Type: String
    Default: v1
    Description: Tag pushed to <NamePrefix>-lab-snmpd
  MultitoolImageTag:
    Type: String
    Default: v0.10.0
    Description: Tag pushed to <NamePrefix>-lab-multitool

Conditions:
  HasEndpointSgCond: !Not [!Equals [!Ref EndpointSecurityGroupId, ""]]

Resources:
  LabSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub ${NamePrefix}-lab
      GroupDescription: Lab EC2 - no inbound, outbound HTTPS only (SSM, ECR, S3 gateway)
      VpcId: !Ref VpcId
      # 受信ルールは置かない。操作は SSM Session Manager（SSM Agent が内側から ssmmessages へつなぎに行く）。
      # lab のアドレス（203.0.113.0/24 / 172.16.0.0/16 / 10.x.0.0/24）は EC2 の中の docker network と veth に閉じていて VPC には出ない
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: HTTPS to VPC endpoints and S3 gateway endpoint
        - IpProtocol: tcp
          FromPort: 9098
          ToPort: 9098
          CidrIp: 0.0.0.0/0
          Description: Phase 2 - Kafka with IAM auth to the MSK brokers of stream.yaml (private IPs in this VPC, no NAT)
      Tags:
        - { Key: Name, Value: !Sub "${NamePrefix}-lab" }
        - { Key: Project, Value: !Ref NamePrefix }
        - { Key: owner, Value: !Ref Owner }

  EndpointIngressFromLab:
    Type: AWS::EC2::SecurityGroupIngress
    Condition: HasEndpointSgCond
    Properties:
      GroupId: !Ref EndpointSecurityGroupId
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      SourceSecurityGroupId: !Ref LabSecurityGroup
      Description: HTTPS from lab EC2 (ssm, ssmmessages, ecr.api, ecr.dkr)

  LabRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${NamePrefix}-lab
      Description: fukuda-nwc-poc lab EC2 - SSM managed node, pull lab images from ECR, read lab/ from the asset bucket
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: lab-assets
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: EcrPull
                Effect: Allow
                Action: [ecr:BatchGetImage, ecr:GetDownloadUrlForLayer, ecr:BatchCheckLayerAvailability]
                Resource: !Sub arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/${NamePrefix}-lab-*
              - Sid: EcrToken
                Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Sid: S3Read
                Effect: Allow
                Action: s3:GetObject
                Resource: !Sub arn:${AWS::Partition}:s3:::${AssetBucketName}/lab/*
              - Sid: S3List
                Effect: Allow
                Action: s3:ListBucket
                Resource: !Sub arn:${AWS::Partition}:s3:::${AssetBucketName}
                Condition:
                  StringLike:
                    s3:prefix: lab/*
      Tags:
        - { Key: Name, Value: !Sub "${NamePrefix}-lab" }
        - { Key: Project, Value: !Ref NamePrefix }
        - { Key: owner, Value: !Ref Owner }

  LabInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Sub ${NamePrefix}-lab
      Roles: [!Ref LabRole]

  LabInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref ImageId
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref LabInstanceProfile
      NetworkInterfaces:
        - DeviceIndex: "0"
          SubnetId: !Ref SubnetId
          GroupSet: [!Ref LabSecurityGroup]
          AssociatePublicIpAddress: false
      MetadataOptions:
        HttpEndpoint: enabled
        HttpTokens: required
        # コンテナからは IMDS に届かせない（hop limit 1 は docker bridge を越えない）
        HttpPutResponseHopLimit: 1
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeType: gp3
            VolumeSize: !Ref VolumeSize
            Encrypted: true
            DeleteOnTermination: true
      PropagateTagsToVolumeOnCreation: true
      Tags:
        - { Key: Name, Value: !Sub "${NamePrefix}-lab" }
        - { Key: Project, Value: !Ref NamePrefix }
        - { Key: owner, Value: !Ref Owner }
      # 起動のたびに流す（cloud-config の always）。S3 の lab/ を置き直して再起動すれば設定も更新される。
      # 本文は Fn::Sub を通るので「ドル記号 + 波かっこ」を書かない（$LAB のような素の変数は通る）
      UserData:
        Fn::Base64: !Sub |
          Content-Type: multipart/mixed; boundary="==BOUNDARY=="
          MIME-Version: 1.0

          --==BOUNDARY==
          Content-Type: text/cloud-config; charset="us-ascii"
          MIME-Version: 1.0

          #cloud-config
          cloud_final_modules:
          - [scripts-user, always]

          --==BOUNDARY==
          Content-Type: text/x-shellscript; charset="utf-8"
          MIME-Version: 1.0
          Content-Transfer-Encoding: 8bit

          #!/bin/bash
          set -euo pipefail
          LAB=/opt/${NamePrefix}-lab
          REGISTRY=${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com
          # Docker は AL2023 のリポジトリから（S3 ゲートウェイエンドポイント経由）。containerlab は S3 に置いた rpm から
          command -v docker >/dev/null || dnf install -y docker
          systemctl enable --now docker
          install -d -m 0755 $LAB
          aws s3 sync --delete --region ${AWS::Region} s3://${AssetBucketName}/lab/ $LAB/src/
          if [ ! -f $LAB/src/lab.sh ] || [ ! -f $LAB/src/containerlab_${ContainerlabVersion}_linux_arm64.rpm ]; then
            echo "lab/ or the containerlab rpm is not in s3://${AssetBucketName}/lab/ yet. Upload (output UploadLabCommand) and reboot." >&2
            exit 0
          fi
          command -v containerlab >/dev/null || dnf install -y $LAB/src/containerlab_${ContainerlabVersion}_linux_arm64.rpm
          chmod 0755 $LAB/src/lab.sh
          ln -sfn $LAB/src/lab.sh /usr/local/bin/lab
          # フェーズ 2: Telegraf の rpm が lab/ にあれば入れる（無ければ何もしない。stream.yaml が無くてもここは通る）
          TELEGRAF_RPM=$LAB/src/telegraf-${TelegrafVersion}-1.aarch64.rpm
          if [ -f $TELEGRAF_RPM ] && ! rpm -q telegraf-${TelegrafVersion} >/dev/null 2>&1; then
            dnf install -y $TELEGRAF_RPM
            systemctl disable --now telegraf.service 2>/dev/null || true
          fi

          cat > /etc/${NamePrefix}-lab.env <<__ENV__
          AWS_REGION=${AWS::Region}
          REGISTRY=$REGISTRY
          FRR_IMAGE=$REGISTRY/${NamePrefix}-lab-frr:${FrrImageTag}
          SNMPD_IMAGE=$REGISTRY/${NamePrefix}-lab-snmpd:${SnmpdImageTag}
          MULTITOOL_IMAGE=$REGISTRY/${NamePrefix}-lab-multitool:${MultitoolImageTag}
          PARAM_PREFIX=/${NamePrefix}
          __ENV__

          cat > /etc/systemd/system/${NamePrefix}-lab.service <<__UNIT__
          [Unit]
          Description=${NamePrefix} containerlab topology (wvs2)
          After=docker.service network-online.target
          Requires=docker.service

          [Service]
          Type=oneshot
          RemainAfterExit=yes
          ExecStart=$LAB/src/lab.sh up
          ExecStop=$LAB/src/lab.sh down
          TimeoutStartSec=600

          [Install]
          WantedBy=multi-user.target
          __UNIT__

          # フェーズ 2: Telegraf。ExecStartPre で SSM の /<NamePrefix>/msk-bootstrap を読んで設定を作る。stream.yaml が無い間は
          # 失敗して 60 秒ごとに試し直す（トポロジには影響しない）。162/udp で trap を受けるので root で動かす
          if [ -f $TELEGRAF_RPM ]; then
            cat > /etc/systemd/system/${NamePrefix}-telegraf.service <<__UNIT__
          [Unit]
          Description=${NamePrefix} Telegraf - SNMP poll + trap from the lab to MSK (phase 2)
          After=docker.service network-online.target ${NamePrefix}-lab.service
          Wants=${NamePrefix}-lab.service

          [Service]
          EnvironmentFile=/etc/${NamePrefix}-lab.env
          WorkingDirectory=$LAB/src
          ExecStartPre=$LAB/src/lab.sh telegraf-render
          ExecStart=/usr/bin/telegraf --config /etc/telegraf/telegraf.conf
          Restart=on-failure
          RestartSec=60

          [Install]
          WantedBy=multi-user.target
          __UNIT__
          fi

          systemctl daemon-reload
          $LAB/src/lab.sh render
          $LAB/src/lab.sh pull
          if [ "${AutoStartLab}" = "true" ]; then
            systemctl enable ${NamePrefix}-lab.service
            systemctl restart ${NamePrefix}-lab.service
          else
            systemctl disable ${NamePrefix}-lab.service || true
          fi
          if [ -f $TELEGRAF_RPM ]; then
            systemctl enable ${NamePrefix}-telegraf.service
            systemctl restart ${NamePrefix}-telegraf.service || true
          fi
          --==BOUNDARY==--

Outputs:
  LabInstanceId:
    Value: !Ref LabInstance
  StartSessionCommand:
    Description: Run on the user's PC (AWS CLI v2 + Session Manager plugin), then "sudo lab check" / "sudo lab failover" / "sudo lab status"
    Value: !Sub aws ssm start-session --region ${AWS::Region} --target ${LabInstance}
  StopCommand:
    Description: Stop the instance when not in use (no compute charge while stopped; the EBS volume is still charged)
    Value: !Sub aws ec2 stop-instances --region ${AWS::Region} --instance-ids ${LabInstance}
  StartCommand:
    Description: Start it again. The topology is deployed at boot when AutoStartLab is true.
    Value: !Sub aws ec2 start-instances --region ${AWS::Region} --instance-ids ${LabInstance}
  UploadLabCommand:
    Description: Run in this repository after downloading the containerlab rpm (README lab step 2). Re-run and reboot to change configs. Phase 2 adds the Telegraf rpm (README stream step 1).
    Value: !Sub aws s3 sync lab/ s3://${AssetBucketName}/lab/ --exclude "wvs2.clab.yml" && aws s3 cp containerlab_${ContainerlabVersion}_linux_arm64.rpm s3://${AssetBucketName}/lab/
  UploadTelegrafCommand:
    Description: Phase 2. Run after downloading https://dl.influxdata.com/telegraf/releases/telegraf-<TelegrafVersion>-1.aarch64.rpm, then reboot the instance
    Value: !Sub aws s3 cp telegraf-${TelegrafVersion}-1.aarch64.rpm s3://${AssetBucketName}/lab/
  LabSecurityGroupId:
    Description: If EndpointSecurityGroupId was left empty, allow 443 from this SG on the ssm / ssmmessages / ecr endpoints by hand
    Value: !Ref LabSecurityGroup
