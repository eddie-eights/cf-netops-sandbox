# 検知（保存済みサーチ）と、その結果を SNS へ出すアラートアクション（netops_sns）。splunk/Dockerfile がイメージに入れる
[ui]
is_visible = 0
label = NetOps alerts

[launcher]
author = netops-poc
description = Saved searches that detect link / BGP / IS-IS / trap anomalies and an alert action that publishes them to an SNS topic
version = 1.0.0

[install]
state = enabled
is_configured = 1

[package]
id = netops_alerts
