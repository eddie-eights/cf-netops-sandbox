AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  fukuda-nwc-poc - phase 2 stream stack. MSK (2 brokers, IAM auth) receives SNMP polls and traps from Telegraf on the lab EC2 (lab.yaml),
  a detector Lambda writes link_down / trap anomalies to DynamoDB, and MSK Connect keeps the raw messages in the asset bucket (S3 sink).
  The chat runtime and web read the anomaly table. Costs about 0.13 USD per hour while it exists - delete it the same day.

Metadata:
  # W6001: 出力のコマンド文字列に main.yaml のバケット名（Fn::ImportValue）を埋めるのは意図どおり
  cfn-lint:
    config:
      ignore_checks: [W6001]
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: { default: Naming }
        Parameters: [NamePrefix, Owner]
      - Label: { default: Network (same VPC as main.yaml) }
        Parameters: [CreateLambdaEndpoints, CreateDynamoDbEndpoint]
      - Label: { default: Producers and readers }
        Parameters: [DeviceMap]
      - Label: { default: MSK }
        Parameters: [KafkaVersion, BrokerInstanceType, LogRetentionDays]
      - Label: { default: S3 sink (MSK Connect) }
        Parameters: [CreateS3Sink, KafkaConnectVersion, S3SinkPluginKey]

Parameters:
  NamePrefix:
    Type: String
    Default: fukuda-nwc-poc
    AllowedPattern: "^[a-z][a-z0-9-]{1,24}$"
    Description: Same value as main.yaml (the IAM role names <NamePrefix>-runtime / <NamePrefix>-web get the DynamoDB policy)
  Owner:
    Type: String
    Default: fukuda
    AllowedPattern: "^[A-Za-z0-9._-]{1,64}$"
    Description: Value of the owner tag
  CreateLambdaEndpoints:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: lambda and sts interface endpoints (1 AZ, first subnet). The MSK event source mapping of the detector needs them because the VPC has no NAT. Set false if the VPC already has them.
  CreateDynamoDbEndpoint:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: DynamoDB gateway endpoint (free) so the chat web EC2 reads the anomaly table without NAT. Set false if the VPC already has one.
  DeviceMap:
    Type: String
    Default: "203.0.113.11=hq-ce-01,203.0.113.12=dc-ce-01,203.0.113.13=br1-ce-01,203.0.113.14=br2-ce-01"
    Description: "ip=device_id,... used by the detector when a message has no sysName tag (traps). Matches lab/wvs2.clab.yml.in and agent/data/devices.yaml."
  KafkaVersion:
    Type: String
    Default: 3.9.x
    Description: MSK provisioned Kafka version. 3.9.x is the recommended version (checked 2026-09-15).
  BrokerInstanceType:
    Type: String
    Default: kafka.t3.small
    AllowedValues: [kafka.t3.small, kafka.m7g.large]
    Description: kafka.t3.small is the smallest provisioned broker (2 brokers, about 0.09 USD per hour together in Tokyo - verify in the pricing page)
  LogRetentionDays:
    Type: Number
    Default: 7
    AllowedValues: [1, 3, 7, 14, 30]
  CreateS3Sink:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: MSK Connect S3 sink (1 MCU, about 0.11 USD per hour). Needs the plugin zip at S3SinkPluginKey (README stream step 2). Set false to run without the sink.
  KafkaConnectVersion:
    Type: String
    Default: 2.7.1
    Description: Kafka Connect version of MSK Connect. The allowed values are not listed in the CloudFormation reference (not verified) - 2.7.1 is the value shown in the MSK Connect documentation examples.
  S3SinkPluginKey:
    Type: String
    Default: stream/confluentinc-kafka-connect-s3-12.1.11.zip
    Description: Key of the Confluent S3 sink connector zip in the asset bucket (download from Confluent Hub, upload with output UploadPluginCommand)

Conditions:
  CreateLambdaEndpointsCond: !Equals [!Ref CreateLambdaEndpoints, "true"]
  CreateDynamoDbEndpointCond: !Equals [!Ref CreateDynamoDbEndpoint, "true"]
  CreateS3SinkCond: !Equals [!Ref CreateS3Sink, "true"]

Resources:
  # ---------------------------------------------------------------- security groups
  MskSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub ${NamePrefix}-msk
      GroupDescription: MSK brokers - Kafka IAM (9098) from the lab EC2, from MSK Connect and from the Lambda event source mapping (same group)
      VpcId: { "Fn::ImportValue": !Sub "${NamePrefix}-vpc-id" }
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: MSK Connect workers and the ESM ENIs - S3 gateway, logs / lambda / sts endpoints
        - IpProtocol: tcp
          FromPort: 9092
          ToPort: 9098
          CidrIp: 0.0.0.0/0
          Description: Kafka between brokers, Connect workers and ESM ENIs (all carry this group)
      Tags:
        - { Key: Name, Value: !Sub "${NamePrefix}-msk" }
        - { Key: Project, Value: !Ref NamePrefix }
        - { Key: owner, Value: !Ref Owner }

  MskSelfIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref MskSecurityGroup
      IpProtocol: tcp
      FromPort: 9092
      ToPort: 9098
      SourceSecurityGroupId: !Ref MskSecurityGroup
      Description: Brokers, MSK Connect workers and Lambda ESM ENIs talk to each other

  MskLabIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref MskSecurityGroup
      IpProtocol: tcp
      FromPort: 9098
      ToPort: 9098
      SourceSecurityGroupId: { "Fn::ImportValue": !Sub "${NamePrefix}-lab-sg-id" }
      Description: Telegraf on the lab EC2 (Kafka IAM)

  EndpointFromMskIngress:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: { "Fn::ImportValue": !Sub "${NamePrefix}-endpoint-sg-id" }
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      SourceSecurityGroupId: !Ref MskSecurityGroup
      Description: MSK Connect worker logs and Lambda ESM through the endpoints of main.yaml

  StreamEndpointSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Condition: CreateLambdaEndpointsCond
    Properties:
      GroupName: !Sub ${NamePrefix}-stream-endpoints
      GroupDescription: lambda / sts interface endpoints - HTTPS from the MSK security group
      VpcId: { "Fn::ImportValue": !Sub "${NamePrefix}-vpc-id" }
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          SourceSecurityGroupId: !Ref MskSecurityGroup
          Description: HTTPS from the ESM ENIs and MSK Connect workers
      Tags:
        - { Key: Name, Value: !Sub "${NamePrefix}-stream-endpoints" }
        - { Key: Project, Value: !Ref NamePrefix }
        - { Key: owner, Value: !Ref Owner }

  # ---------------------------------------------------------------- VPC endpoints
  # ESM の ENI は MSK のサブネット / SG に置かれ、Lambda と STS へ届く必要がある（NAT が無いので interface endpoint。1 AZ で足りる）
  LambdaEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Condition: CreateLambdaEndpointsCond
    Properties:
      VpcId: { "Fn::ImportValue": !Sub "${NamePrefix}-vpc-id" }
      ServiceName: !Sub com.amazonaws.${AWS::Region}.lambda
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds: [!Select [0, !Split [",", { "Fn::ImportValue": !Sub "${NamePrefix}-runtime-subnet-ids" }]]]
      SecurityGroupIds: [!Ref StreamEndpointSecurityGroup]
      Tags:
        - { Key: Name, Value: !Sub "${NamePrefix}-lambda" }
        - { Key: Project, Value: !Ref NamePrefix }
        - { Key: owner, Value: !Ref Owner }

  StsEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Condition: CreateLambdaEndpointsCond
    Properties:
      VpcId: { "Fn::ImportValue": !Sub "${NamePrefix}-vpc-id" }
      ServiceName: !Sub com.amazonaws.${AWS::Region}.sts
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds: [!Select [0, !Split [",", { "Fn::ImportValue": !Sub "${NamePrefix}-runtime-subnet-ids" }]]]
      SecurityGroupIds: [!Ref StreamEndpointSecurityGroup]
      Tags:
        - { Key: Name, Value: !Sub "${NamePrefix}-sts" }
        - { Key: Project, Value: !Ref NamePrefix }
        - { Key: owner, Value: !Ref Owner }

  DynamoDbEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Condition: CreateDynamoDbEndpointCond
    Properties:
      VpcId: { "Fn::ImportValue": !Sub "${NamePrefix}-vpc-id" }
      ServiceName: !Sub com.amazonaws.${AWS::Region}.dynamodb
      VpcEndpointType: Gateway
      RouteTableIds: !Split [",", { "Fn::ImportValue": !Sub "${NamePrefix}-route-table-ids" }]

  # ---------------------------------------------------------------- MSK
  MskConfiguration:
    Type: AWS::MSK::Configuration
    Properties:
      Name: !Sub ${NamePrefix}-stream
      KafkaVersionsList: [!Ref KafkaVersion]
      ServerProperties: |
        auto.create.topics.enable=true
        default.replication.factor=2
        min.insync.replicas=1
        num.partitions=2
        log.retention.hours=24

  MskLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /${NamePrefix}/msk
      RetentionInDays: !Ref LogRetentionDays

  MskCluster:
    Type: AWS::MSK::Cluster
    Properties:
      ClusterName: !Sub ${NamePrefix}-stream
      KafkaVersion: !Ref KafkaVersion
      NumberOfBrokerNodes: 2
      BrokerNodeGroupInfo:
        InstanceType: !Ref BrokerInstanceType
        # main.yaml の Runtime サブネットの先頭 2 つ（ブローカー 2 台 = サブネット 2 つ）
        ClientSubnets: [!Select [0, !Split [",", { "Fn::ImportValue": !Sub "${NamePrefix}-runtime-subnet-ids" }]], !Select [1, !Split [",", { "Fn::ImportValue": !Sub "${NamePrefix}-runtime-subnet-ids" }]]]
        SecurityGroups: [!Ref MskSecurityGroup]
        StorageInfo:
          EBSStorageInfo:
            VolumeSize: 10
      ClientAuthentication:
        Sasl:
          Iam: { Enabled: true }
        Unauthenticated: { Enabled: false }
      EncryptionInfo:
        EncryptionInTransit:
          ClientBroker: TLS
          InCluster: true
      ConfigurationInfo:
        Arn: !GetAtt MskConfiguration.Arn
        Revision: !GetAtt MskConfiguration.LatestRevision.Revision
      LoggingInfo:
        BrokerLogs:
          CloudWatchLogs:
            Enabled: true
            LogGroup: !Ref MskLogGroup
      Tags:
        Name: !Sub ${NamePrefix}-stream
        Project: !Ref NamePrefix
        owner: !Ref Owner

  # ブローカーのアドレスはクラスタ作成後にしか分からないので、カスタムリソースで引いて SSM に置く（Telegraf と MSK Connect が使う）
  BootstrapRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${NamePrefix}-msk-bootstrap
      Description: fukuda-nwc-poc - custom resource that reads the MSK bootstrap brokers
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: read-brokers
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: kafka:GetBootstrapBrokers
                Resource: !Ref MskCluster
      Tags:
        - { Key: Project, Value: !Ref NamePrefix }
        - { Key: owner, Value: !Ref Owner }

  BootstrapFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub ${NamePrefix}-msk-bootstrap
      Description: Returns the SASL/IAM bootstrap broker string of the MSK cluster (custom resource)
      Runtime: python3.13
      Architectures: [arm64]
      Handler: index.handler
      Role: !GetAtt BootstrapRole.Arn
      Timeout: 30
      Code:
        ZipFile: |
          import boto3, cfnresponse
          def handler(event, context):
              try:
                  data = {}
                  if event["RequestType"] != "Delete":
                      r = boto3.client("kafka").get_bootstrap_brokers(ClusterArn=event["ResourceProperties"]["ClusterArn"])
                      data["BootstrapBrokers"] = r["BootstrapBrokerStringSaslIam"]
                  cfnresponse.send(event, context, cfnresponse.SUCCESS, data, "bootstrap")
              except Exception as e:
                  cfnresponse.send(event, context, cfnresponse.FAILED, {"Error": str(e)}, "bootstrap")
      Tags:
        - { Key: Project, Value: !Ref NamePrefix }
        - { Key: owner, Value: !Ref Owner }

  Bootstrap:
    Type: Custom::MskBootstrap
    Properties:
      ServiceToken: !GetAtt BootstrapFunction.Arn
      ClusterArn: !Ref MskCluster

  BootstrapParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /${NamePrefix}/msk-bootstrap
      Type: String
      Value: !GetAtt Bootstrap.BootstrapBrokers
      Description: MSK bootstrap brokers (SASL/IAM, 9098). Read by Telegraf on the lab EC2 at start.
      Tags:
        Project: !Ref NamePrefix
        owner: !Ref Owner

  # ---------------------------------------------------------------- DynamoDB (anomaly list)
  AnomalyTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub ${NamePrefix}-anomalies
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: anomaly_id, AttributeType: S }
        - { AttributeName: status, AttributeType: S }
        - { AttributeName: last_seen, AttributeType: N }
      KeySchema:
        - { AttributeName: anomaly_id, KeyType: HASH }
      GlobalSecondaryIndexes:
        - IndexName: status-last_seen-index
          KeySchema:
            - { AttributeName: status, KeyType: HASH }
            - { AttributeName: last_seen, KeyType: RANGE }
          Projection: { ProjectionType: ALL }
      Tags:
        - { Key: Project, Value: !Ref NamePrefix }
        - { Key: owner, Value: !Ref Owner }

  AnomalyTableParameter:
    Type: AWS::SSM::Parameter
    Properties:
      Name: !Sub /${NamePrefix}/anomaly-table
      Type: String
      Value: !Ref AnomalyTable
      Description: DynamoDB table of the anomaly list. Read by the chat runtime and the chat web (agent/anomalies.py).
      Tags:
        Project: !Ref NamePrefix
        owner: !Ref Owner

  # ---------------------------------------------------------------- detector Lambda (outside the VPC; the ESM ENIs live in the MSK subnets)
  DetectorRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${NamePrefix}-detector
      Description: fukuda-nwc-poc detector - read MSK topics through the event source mapping, write the anomaly table
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaMSKExecutionRole
      Policies:
        - PolicyName: detector
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: KafkaRead
                Effect: Allow
                Action: [kafka-cluster:Connect, kafka-cluster:DescribeGroup, kafka-cluster:AlterGroup, kafka-cluster:DescribeTopic, kafka-cluster:ReadData, kafka-cluster:DescribeClusterDynamicConfiguration]
                Resource:
                  - !Ref MskCluster
                  - !Sub ["${A}/*", { A: !Join [":topic/", !Split [":cluster/", !Ref MskCluster]] }]
                  - !Sub ["${A}/*", { A: !Join [":group/", !Split [":cluster/", !Ref MskCluster]] }]
              - Sid: Table
                Effect: Allow
                Action: dynamodb:UpdateItem
                Resource: !GetAtt AnomalyTable.Arn
      Tags:
        - { Key: Project, Value: !Ref NamePrefix }
        - { Key: owner, Value: !Ref Owner }

  DetectorLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${NamePrefix}-detector
      RetentionInDays: !Ref LogRetentionDays

  DetectorFunction:
    Type: AWS::Lambda::Function
    DependsOn: DetectorLogGroup
    Properties:
      FunctionName: !Sub ${NamePrefix}-detector
      Description: Reads the metrics / traps topics and records link_down and trap anomalies in DynamoDB (same code as stream/detector.py)
      Runtime: python3.13
      Architectures: [arm64]
      Handler: index.handler
      Role: !GetAtt DetectorRole.Arn
      Timeout: 60
      MemorySize: 256
      Environment:
        Variables:
          TABLE: !Ref AnomalyTable
          DEVICE_MAP: !Ref DeviceMap
      Code:
        ZipFile: |
          """detector Lambda。MSK の metrics / traps トピックを読み、異常を DynamoDB に書く。

          stream.yaml の ZipFile と同じ内容（tests/test_stream.py が一致を確かめる。4096 文字まで）。
          記録: ifOperStatus が down のインタフェース（ポーリング）と linkDown トラップ（即時）。
          解消: up に戻ったポーリング、linkUp トラップ。キーは <機器>#<種別>#<インタフェース>。
          機器名は sysName タグ > DEVICE_MAP（IP=機器名,...）の順で引く。
          """
          import base64, json, os, time
          import boto3

          TABLE = boto3.resource("dynamodb").Table(os.environ["TABLE"])
          DEVMAP = dict(p.split("=", 1) for p in os.environ.get("DEVICE_MAP", "").split(",") if "=" in p)
          LINK_DOWN, LINK_UP = ".1.3.6.1.6.3.1.1.5.3", ".1.3.6.1.6.3.1.1.5.4"


          def device(m):
              t = m.get("tags", {})
              return t.get("sysName") or DEVMAP.get(t.get("agent_host") or t.get("source", ""), t.get("agent_host") or t.get("source", "?"))


          def events(m):
              """1 メトリクスから (機器, 種別, インタフェース, 開く/閉じる, 元) を出す"""
              name, f, t = m.get("name"), m.get("fields", {}), m.get("tags", {})
              if name == "interface" and "ifOperStatus" in f:
                  ifn = t.get("ifDescr") or t.get("ifIndex") or "?"
                  if ifn.startswith("lo"):
                      return []
                  return [(device(m), "link_down", ifn, int(f["ifOperStatus"]) == 2, "poll")]
              if name == "snmp_trap":
                  oid = t.get("oid", "")
                  if oid in (LINK_DOWN, LINK_UP):
                      # MIB が無いと varbind の名前は数値 OID（末尾に ifIndex が付く）。ifDescr を優先し、無ければ ifIndex
                      ifn = "?"
                      for pre in ("ifDescr", ".1.3.6.1.2.1.2.2.1.2", "ifIndex", ".1.3.6.1.2.1.2.2.1.1"):
                          v = [v for k, v in f.items() if k == pre or k.startswith(pre + ".")]
                          if v:
                              ifn = str(v[0])
                              break
                      return [(device(m), "link_down", ifn, oid == LINK_DOWN, "trap")]
                  return [(device(m), "trap", oid, True, "trap")]
              return []


          def handler(event, _ctx):
              now = int(time.time())
              n = 0
              for recs in event.get("records", {}).values():
                  for r in recs:
                      try:
                          m = json.loads(base64.b64decode(r["value"]))
                      except (ValueError, KeyError):
                          continue
                      for dev, kind, ifn, opened, src in events(m if isinstance(m, dict) else {}):
                          key = f"{dev}#{kind}#{ifn}"
                          if opened:
                              TABLE.update_item(
                                  Key={"anomaly_id": key},
                                  UpdateExpression="SET device_id=:d, kind=:k, target=:i, #s=:o, last_seen=:n, #src=:p, first_seen=if_not_exists(first_seen,:n), detail=:t",
                                  ExpressionAttributeNames={"#s": "status", "#src": "source"},
                                  ExpressionAttributeValues={":d": dev, ":k": kind, ":i": ifn, ":o": "open", ":n": now, ":p": src,
                                                             ":t": f"{ifn} is down ({src})" if kind == "link_down" else f"trap {ifn}"},
                              )
                          else:
                              try:
                                  TABLE.update_item(
                                      Key={"anomaly_id": key}, ConditionExpression="#s = :o",
                                      UpdateExpression="SET #s=:r, resolved_at=:n, last_seen=:n",
                                      ExpressionAttributeNames={"#s": "status"},
                                      ExpressionAttributeValues={":o": "open", ":r": "resolved", ":n": now},
                                  )
                              except TABLE.meta.client.exceptions.ConditionalCheckFailedException:
                                  continue  # 開いていない異常の up は何もしない（正常時のポーリングは毎回ここ）
                          n += 1
              return {"processed": n}
      Tags:
        - { Key: Project, Value: !Ref NamePrefix }
        - { Key: owner, Value: !Ref Owner }

  DetectorMetricsMapping:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      FunctionName: !Ref DetectorFunction
      EventSourceArn: !Ref MskCluster
      Topics: [metrics]
      StartingPosition: LATEST
      BatchSize: 100
      MaximumBatchingWindowInSeconds: 5

  DetectorTrapsMapping:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      FunctionName: !Ref DetectorFunction
      EventSourceArn: !Ref MskCluster
      Topics: [traps]
      StartingPosition: LATEST
      BatchSize: 10
      MaximumBatchingWindowInSeconds: 1

  # ---------------------------------------------------------------- MSK Connect S3 sink (raw messages to s3://<bucket>/stream/)
  ConnectRole:
    Type: AWS::IAM::Role
    Condition: CreateS3SinkCond
    Properties:
      RoleName: !Sub ${NamePrefix}-connect
      Description: fukuda-nwc-poc MSK Connect - read the topics, write objects under stream/ in the asset bucket
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: kafkaconnect.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals: { "aws:SourceAccount": !Ref AWS::AccountId }
              ArnLike: { "aws:SourceArn": !Sub "arn:${AWS::Partition}:kafkaconnect:${AWS::Region}:${AWS::AccountId}:connector/${NamePrefix}-s3-sink/*" }
      Policies:
        - PolicyName: connect
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: Kafka
                Effect: Allow
                Action: [kafka-cluster:Connect, kafka-cluster:DescribeCluster, kafka-cluster:ReadData, kafka-cluster:DescribeTopic, kafka-cluster:WriteData, kafka-cluster:CreateTopic, kafka-cluster:AlterGroup, kafka-cluster:DescribeGroup]
                Resource:
                  - !Ref MskCluster
                  - !Sub ["${A}/*", { A: !Join [":topic/", !Split [":cluster/", !Ref MskCluster]] }]
                  - !Sub ["${A}/*", { A: !Join [":group/", !Split [":cluster/", !Ref MskCluster]] }]
              - Sid: Bucket
                Effect: Allow
                Action: [s3:ListBucket, s3:GetBucketLocation, s3:ListBucketMultipartUploads]
                Resource: !Sub
                  - arn:${AWS::Partition}:s3:::${Bucket}
                  - Bucket: { "Fn::ImportValue": !Sub "${NamePrefix}-kb-bucket-name" }
              - Sid: Objects
                Effect: Allow
                Action: [s3:PutObject, s3:GetObject, s3:DeleteObject, s3:AbortMultipartUpload, s3:ListMultipartUploadParts]
                Resource: !Sub
                  - arn:${AWS::Partition}:s3:::${Bucket}/stream/*
                  - Bucket: { "Fn::ImportValue": !Sub "${NamePrefix}-kb-bucket-name" }
      Tags:
        - { Key: Project, Value: !Ref NamePrefix }
        - { Key: owner, Value: !Ref Owner }

  ConnectLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: CreateS3SinkCond
    Properties:
      LogGroupName: !Sub /${NamePrefix}/connect
      RetentionInDays: !Ref LogRetentionDays

  S3SinkPlugin:
    Type: AWS::KafkaConnect::CustomPlugin
    Condition: CreateS3SinkCond
    Properties:
      Name: !Sub ${NamePrefix}-s3-sink
      Description: Confluent S3 sink connector (zip from Confluent Hub, uploaded to the asset bucket)
      ContentType: ZIP
      Location:
        S3Location:
          BucketArn: !Sub
            - arn:${AWS::Partition}:s3:::${Bucket}
            - Bucket: { "Fn::ImportValue": !Sub "${NamePrefix}-kb-bucket-name" }
          FileKey: !Ref S3SinkPluginKey
      Tags:
        - { Key: Project, Value: !Ref NamePrefix }
        - { Key: owner, Value: !Ref Owner }

  S3SinkConnector:
    Type: AWS::KafkaConnect::Connector
    Condition: CreateS3SinkCond
    Properties:
      ConnectorName: !Sub ${NamePrefix}-s3-sink
      ConnectorDescription: metrics and traps topics to s3://<bucket>/stream/<topic>/dt=.../hour=.../ as JSON lines, rotated every minute
      KafkaConnectVersion: !Ref KafkaConnectVersion
      Capacity:
        ProvisionedCapacity:
          McuCount: 1
          WorkerCount: 1
      KafkaCluster:
        ApacheKafkaCluster:
          BootstrapServers: !GetAtt Bootstrap.BootstrapBrokers
          Vpc:
            SecurityGroups: [!Ref MskSecurityGroup]
            Subnets: [!Select [0, !Split [",", { "Fn::ImportValue": !Sub "${NamePrefix}-runtime-subnet-ids" }]], !Select [1, !Split [",", { "Fn::ImportValue": !Sub "${NamePrefix}-runtime-subnet-ids" }]]]
      KafkaClusterClientAuthentication: { AuthenticationType: IAM }
      KafkaClusterEncryptionInTransit: { EncryptionType: TLS }
      Plugins:
        - CustomPlugin:
            CustomPluginArn: !GetAtt S3SinkPlugin.CustomPluginArn
            Revision: !GetAtt S3SinkPlugin.Revision
      ServiceExecutionRoleArn: !GetAtt ConnectRole.Arn
      LogDelivery:
        WorkerLogDelivery:
          CloudWatchLogs:
            Enabled: true
            LogGroup: !Ref ConnectLogGroup
      ConnectorConfiguration:
        connector.class: io.confluent.connect.s3.S3SinkConnector
        tasks.max: "1"
        topics: metrics,traps
        s3.region: !Ref AWS::Region
        s3.bucket.name: { "Fn::ImportValue": !Sub "${NamePrefix}-kb-bucket-name" }
        topics.dir: stream
        flush.size: "1000"
        rotate.schedule.interval.ms: "60000"
        storage.class: io.confluent.connect.s3.storage.S3Storage
        format.class: io.confluent.connect.s3.format.json.JsonFormat
        partitioner.class: io.confluent.connect.storage.partitioner.TimeBasedPartitioner
        path.format: "'dt'=YYYY-MM-dd/'hour'=HH"
        partition.duration.ms: "3600000"
        locale: ja_JP
        timezone: Asia/Tokyo
        timestamp.extractor: Record
        key.converter: org.apache.kafka.connect.storage.StringConverter
        value.converter: org.apache.kafka.connect.json.JsonConverter
        value.converter.schemas.enable: "false"
        schema.compatibility: NONE
      Tags:
        - { Key: Project, Value: !Ref NamePrefix }
        - { Key: owner, Value: !Ref Owner }

  # ---------------------------------------------------------------- permissions for the roles of main.yaml / lab.yaml (by name)
  ReaderPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: !Sub ${NamePrefix}-anomalies-read
      Roles: [!Sub "${NamePrefix}-runtime", !Sub "${NamePrefix}-web"]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: Table
            Effect: Allow
            Action: [dynamodb:Query, dynamodb:GetItem, dynamodb:Scan, dynamodb:UpdateItem]
            Resource:
              - !GetAtt AnomalyTable.Arn
              - !Sub "${AnomalyTable.Arn}/index/*"
          - Sid: Parameters
            Effect: Allow
            Action: ssm:GetParameter
            Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${NamePrefix}/*

  ProducerPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: !Sub ${NamePrefix}-stream-produce
      Roles: [{ "Fn::ImportValue": !Sub "${NamePrefix}-lab-role-name" }]
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: Kafka
            Effect: Allow
            Action: [kafka-cluster:Connect, kafka-cluster:DescribeCluster, kafka-cluster:WriteData, kafka-cluster:WriteDataIdempotently, kafka-cluster:DescribeTopic, kafka-cluster:CreateTopic]
            Resource:
              - !Ref MskCluster
              - !Sub ["${A}/*", { A: !Join [":topic/", !Split [":cluster/", !Ref MskCluster]] }]
          - Sid: Bootstrap
            Effect: Allow
            Action: ssm:GetParameter
            Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${NamePrefix}/msk-bootstrap

Outputs:
  MskClusterArn:
    Value: !Ref MskCluster
  BootstrapBrokers:
    Description: SASL/IAM bootstrap brokers (also in SSM /<NamePrefix>/msk-bootstrap)
    Value: !GetAtt Bootstrap.BootstrapBrokers
  AnomalyTableName:
    Value: !Ref AnomalyTable
  MskSecurityGroupId:
    Value: !Ref MskSecurityGroup
  UploadPluginCommand:
    Description: Run after downloading the Confluent S3 sink zip (README stream step 2). Needed before creating this stack when CreateS3Sink is true.
    Value: !Sub
      - aws s3 cp confluentinc-kafka-connect-s3-12.1.11.zip s3://${Bucket}/${S3SinkPluginKey}
      - Bucket: { "Fn::ImportValue": !Sub "${NamePrefix}-kb-bucket-name" }
  SinkPrefix:
    Description: Where the raw messages land
    Value: !Sub
      - s3://${Bucket}/stream/
      - Bucket: { "Fn::ImportValue": !Sub "${NamePrefix}-kb-bucket-name" }
  DetectorLogs:
    Value: !Sub aws logs tail /aws/lambda/${NamePrefix}-detector --region ${AWS::Region} --follow
