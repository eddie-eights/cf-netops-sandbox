# SNMP を投げる対象の初期値（agent/topology.py の静的データ。Neptune が無いときのトポロジと、Neptune への「静的データを投入」の元）。
# 中身は lab/（containerlab + Nokia SR Linux。Spine-Leaf）の 8 台そのもの。
# 項目名は lab/lab_topology.py が作る形と揃える（tests/test_sync.py が lab の定義と同じであることを確かめる）。
# lab を変える（lab/gen_lab.py を打ち直す）ときはここも直す（ここが唯一のシード。lab 側にコピーは置かない）。
#
# - mgmt_ip は containerlab の mgmt ネットワーク nwc-lab（203.0.113.0/24）上のアドレス。
# - snmp_community は lab 固定の public。実機の値は書かない。
# - device_id は SR Linux の host-name（= SNMP の sysName、syslog の hostname）と同じ値。SNMP 側からも突き合わせられる。
# - 役割は名前から: leafsw = 上流側の Leaf、spine、leaf = アクセス側の Leaf、upstream = 上流の VM（拠点 wan）、host = アクセス側の VM。
# - links は device_id への外部キーなので、topology.json に出る機器は全部ここに要る。ポーリングしない VM も enabled: false で行として置く。
devices:
  - device_id: dc1-leafsw-01
    hostname: dc1-leafsw-01
    site: dc1
    role: leafsw
    mgmt_ip: 203.0.113.11
    snmp_version: v2c
    snmp_community: public
    snmp_port: 161
    poll_interval_seconds: 30
    enabled: true

  - device_id: dc1-leafsw-02
    hostname: dc1-leafsw-02
    site: dc1
    role: leafsw
    mgmt_ip: 203.0.113.12
    snmp_version: v2c
    snmp_community: public
    snmp_port: 161
    poll_interval_seconds: 30
    enabled: true

  - device_id: dc1-spine-01
    hostname: dc1-spine-01
    site: dc1
    role: spine
    mgmt_ip: 203.0.113.21
    snmp_version: v2c
    snmp_community: public
    snmp_port: 161
    poll_interval_seconds: 30
    enabled: true

  - device_id: dc1-spine-02
    hostname: dc1-spine-02
    site: dc1
    role: spine
    mgmt_ip: 203.0.113.22
    snmp_version: v2c
    snmp_community: public
    snmp_port: 161
    poll_interval_seconds: 30
    enabled: true

  - device_id: dc1-leaf-01
    hostname: dc1-leaf-01
    site: dc1
    role: leaf
    mgmt_ip: 203.0.113.31
    snmp_version: v2c
    snmp_community: public
    snmp_port: 161
    poll_interval_seconds: 30
    enabled: true

  - device_id: dc1-leaf-02
    hostname: dc1-leaf-02
    site: dc1
    role: leaf
    mgmt_ip: 203.0.113.32
    snmp_version: v2c
    snmp_community: public
    snmp_port: 161
    poll_interval_seconds: 30
    enabled: true

  - device_id: wan-upstream-01
    hostname: wan-upstream-01
    site: wan
    role: upstream
    mgmt_ip: 203.0.113.101
    snmp_version: v2c
    snmp_community: public
    snmp_port: 161
    poll_interval_seconds: 30
    enabled: false

  - device_id: dc1-host-01
    hostname: dc1-host-01
    site: dc1
    role: host
    mgmt_ip: 203.0.113.102
    snmp_version: v2c
    snmp_community: public
    snmp_port: 161
    poll_interval_seconds: 30
    enabled: false
