agentaddress udp:161
rocommunity public default
# sysName は device_id と一致させる。collector は SNMP の sysName で機器を突き合わせられる
sysName br2-ce-01
sysLocation Branch-2 (lab)
sysContact netops-lab
sysServices 78

# ---- SNMP trap（PIPELINE の stream へ流す）。回線の up/down を 5 秒間隔で見て、ホスト（lab の EC2。docker bridge の 203.0.113.1:162）へ v2c trap を送る。
# lab の EC2 が Telegraf の EC2 へ DNAT する（lab.sh forward）。
# monitor は SNMPv3 の内部ユーザーで自分自身に問い合わせる（net-snmp の仕様。noauth で足りる）
createUser internal
rouser internal noauth
iquerySecName internal
notificationEvent linkUpTrap linkUp -o ifIndex -o ifAdminStatus -o ifOperStatus -o ifDescr
notificationEvent linkDownTrap linkDown -o ifIndex -o ifAdminStatus -o ifOperStatus -o ifDescr
monitor -r 5 -e linkUpTrap "linkUp" ifOperStatus != 2
monitor -r 5 -e linkDownTrap "linkDown" ifOperStatus == 2
trap2sink 203.0.113.1 public 162
