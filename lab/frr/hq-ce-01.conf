frr defaults traditional
hostname hq-ce-01
log stdout
! rsyslog on the lab EC2 reads this file through the bind mount and sends it to Telegraf (Telegraf EC2), which writes it to the Kafka topic "logs"
log file /var/log/frr/frr.log informational
service integrated-vtysh-config
!
interface lo
 ip address 10.255.0.11/32
!
interface eth1
 description WAN primary to carrier-pe-01 1G
 ip address 172.16.1.2/30
!
interface eth2
 description WAN secondary to carrier-pe-02 100M
 ip address 172.16.2.2/30
!
interface eth3
 description LAN 1G
 ip address 10.1.0.1/24
!
router bgp 65001
 bgp router-id 10.255.0.11
 bgp log-neighbor-changes
 no bgp ebgp-requires-policy
 neighbor 172.16.1.1 remote-as 65000
 neighbor 172.16.1.1 description carrier-pe-01-primary
 neighbor 172.16.1.1 timers 10 30
 neighbor 172.16.2.1 remote-as 65000
 neighbor 172.16.2.1 description carrier-pe-02-secondary
 neighbor 172.16.2.1 timers 10 30
 !
 address-family ipv4 unicast
  network 10.1.0.0/24
  network 10.255.0.11/32
  neighbor 172.16.2.1 route-map SECONDARY-IN in
  neighbor 172.16.2.1 route-map SECONDARY-OUT out
 exit-address-family
exit
!
route-map SECONDARY-IN permit 10
 set local-preference 50
exit
!
route-map SECONDARY-OUT permit 10
 set as-path prepend 65001 65001 65001
exit
!
