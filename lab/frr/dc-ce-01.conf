frr defaults traditional
hostname dc-ce-01
log stdout
! rsyslog on the lab EC2 reads this file through the bind mount and sends it to Telegraf (Telegraf EC2), which writes it to the Kafka topic "logs"
log file /var/log/frr/frr.log informational
service integrated-vtysh-config
!
interface lo
 ip address 10.255.0.12/32
!
interface eth1
 description WAN to carrier-pe-02 1G
 ip address 172.16.3.2/30
!
interface eth2
 description LAN 1G
 ip address 10.2.0.1/24
!
router bgp 65002
 bgp router-id 10.255.0.12
 bgp log-neighbor-changes
 no bgp ebgp-requires-policy
 neighbor 172.16.3.1 remote-as 65000
 neighbor 172.16.3.1 description carrier-pe-02
 neighbor 172.16.3.1 timers 10 30
 !
 address-family ipv4 unicast
  network 10.2.0.0/24
  network 10.255.0.12/32
 exit-address-family
exit
!
