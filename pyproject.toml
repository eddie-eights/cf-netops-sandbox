# 手元の確認（tests/）のためだけの設定。AWS に置くものは agent/requirements.txt と web/requirements.txt。
# 使い方: uv sync --group dev → uv run python tests/test_app.py。Web を手元で動かすなら uv sync --group web
[project]
name = "netops-poc"
version = "0.0.0"
description = "NetOps PoC Terraform and local mock tests"
requires-python = ">=3.13,<3.14"

[dependency-groups]
dev = [
  "pyyaml>=6.0",
]
# 手元で web/app.py を動かすとき（docs/development.md「Web を手元で動かす」）。中身は web/requirements.txt と同じ
web = [
  "gradio==5.50.0",
  "boto3>=1.40,<2",
  "pyyaml>=6.0,<7",
]

[tool.uv]
package = false
