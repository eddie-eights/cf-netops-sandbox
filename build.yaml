AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  fukuda-nwc-poc - optional CodeBuild project that builds the arm64 images in AWS (native arm64, no QEMU, no corporate
  proxy or certificate in the way) from a zip you upload to the source bucket of this stack, and pushes them to the
  repositories of ecr.yaml. Replaces README step 2 and lab-1 when the PC cannot build. Costs nothing while idle.

Parameters:
  NamePrefix:
    Type: String
    Default: fukuda-nwc-poc
    AllowedPattern: "^[a-z][a-z0-9-]{1,24}$"
    Description: Same value as ecr.yaml. The project pushes to <NamePrefix>-agent and <NamePrefix>-lab-*.
  Owner:
    Type: String
    Default: fukuda
    AllowedPattern: "^[A-Za-z0-9._-]{1,64}$"
    Description: Value of the owner tag.
  SourceObjectKey:
    Type: String
    Default: src.zip
    AllowedPattern: "^[A-Za-z0-9._/-]{1,200}\\.zip$"
    Description: Object key of the zip in the source bucket that this stack creates. The zip holds agent/ and lab/snmpd/ (README step 2-b).
  LogRetentionDays:
    Type: Number
    Default: 30
    AllowedValues: [1, 3, 5, 7, 14, 30, 60, 90]

Resources:
  # ---------------------------------------------------------------- logs
  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/codebuild/${NamePrefix}-build
      RetentionInDays: !Ref LogRetentionDays
      Tags:
        - { Key: Project, Value: !Ref NamePrefix }
        - { Key: owner, Value: !Ref Owner }

  # ---------------------------------------------------------------- source bucket
  # ここに agent/ と lab/snmpd/ を zip で置く（コンソールのアップロードでよい）。7 日で消えるので放置しても溜まらない
  SourceBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub ${NamePrefix}-build-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      LifecycleConfiguration:
        Rules:
          - { Id: expire, Status: Enabled, ExpirationInDays: 7, AbortIncompleteMultipartUpload: { DaysAfterInitiation: 1 } }
      Tags:
        - { Key: Project, Value: !Ref NamePrefix }
        - { Key: owner, Value: !Ref Owner }

  # ---------------------------------------------------------------- role
  # 読めるのは上のバケット、押せるのは ecr.yaml のリポジトリ（<NamePrefix>-*）だけ
  BuildRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${NamePrefix}-build
      Description: CodeBuild role that builds the arm64 images and pushes them to ECR (fukuda-nwc-poc)
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: codebuild.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals: { "aws:SourceAccount": !Ref AWS::AccountId }
      Policies:
        - PolicyName: build
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: Logs
                Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub "${LogGroup.Arn}:*"
              - Sid: Source
                Effect: Allow
                Action: [s3:GetObject, s3:GetObjectVersion]
                Resource: !Sub "${SourceBucket.Arn}/*"
              - Sid: EcrLogin
                Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              - Sid: EcrPush
                Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:BatchGetImage
                  - ecr:GetDownloadUrlForLayer
                  - ecr:InitiateLayerUpload
                  - ecr:UploadLayerPart
                  - ecr:CompleteLayerUpload
                  - ecr:PutImage
                Resource: !Sub arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/${NamePrefix}-*
      Tags:
        - { Key: Project, Value: !Ref NamePrefix }
        - { Key: owner, Value: !Ref Owner }

  # ---------------------------------------------------------------- project
  # ARM_CONTAINER + aarch64 のイメージなので docker build がそのまま arm64 を作る（buildx も QEMU も要らない）。
  # PrivilegedMode は docker daemon を動かすために要る。
  Project:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub ${NamePrefix}-build
      Description: Builds the arm64 agent / lab images from the public git repository and pushes them to ECR (fukuda-nwc-poc)
      ServiceRole: !GetAtt BuildRole.Arn
      TimeoutInMinutes: 30
      QueuedTimeoutInMinutes: 30
      ConcurrentBuildLimit: 1
      Artifacts: { Type: NO_ARTIFACTS }
      Cache: { Type: NO_CACHE }
      LogsConfig:
        CloudWatchLogs: { Status: ENABLED, GroupName: !Ref LogGroup }
      Environment:
        Type: ARM_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/amazonlinux-aarch64-standard:3.0
        PrivilegedMode: true
        EnvironmentVariables:
          # コンソールの「ビルドの開始」→「環境変数の上書き」で TARGET / IMAGE_TAG を変える
          - { Name: TARGET, Value: agent }        # agent | lab
          - { Name: IMAGE_TAG, Value: v1 }        # agent と lab-snmpd のタグ（同じタグは push できない。更新のたびに変える）
          - { Name: NAME_PREFIX, Value: !Ref NamePrefix }
          - { Name: FRR_TAG, Value: "10.2.1" }
          - { Name: MULTITOOL_TAG, Value: v0.10.0 }
          - { Name: DOCKER_BUILDKIT, Value: "1" }
      Source:
        Type: S3
        Location: !Sub ${SourceBucket}/${SourceObjectKey}
        BuildSpec: |
          version: 0.2
          phases:
            pre_build:
              commands:
                - REG="$(aws sts get-caller-identity --query Account --output text).dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com"
                - aws ecr get-login-password | docker login --username AWS --password-stdin "$REG"
                # zip の中に repo 名のフォルダが 1 段あってもよいように、agent/Dockerfile の場所から根を決める
                - SRC="$(dirname "$(dirname "$(find . -path '*agent/Dockerfile' | head -1)")")"; echo "source root: $SRC"; uname -m
            build:
              commands:
                - |
                  set -eu
                  case "$TARGET" in
                    agent)
                      docker build -t "$REG/$NAME_PREFIX-agent:$IMAGE_TAG" "$SRC/agent"
                      docker push "$REG/$NAME_PREFIX-agent:$IMAGE_TAG"
                      ;;
                    lab)
                      docker pull "quay.io/frrouting/frr:$FRR_TAG"
                      docker tag "quay.io/frrouting/frr:$FRR_TAG" "$REG/$NAME_PREFIX-lab-frr:$FRR_TAG"
                      docker push "$REG/$NAME_PREFIX-lab-frr:$FRR_TAG"
                      docker pull "wbitt/network-multitool:$MULTITOOL_TAG"
                      docker tag "wbitt/network-multitool:$MULTITOOL_TAG" "$REG/$NAME_PREFIX-lab-multitool:$MULTITOOL_TAG"
                      docker push "$REG/$NAME_PREFIX-lab-multitool:$MULTITOOL_TAG"
                      docker build -t "$REG/$NAME_PREFIX-lab-snmpd:$IMAGE_TAG" "$SRC/lab/snmpd"
                      docker push "$REG/$NAME_PREFIX-lab-snmpd:$IMAGE_TAG"
                      ;;
                    *) echo "TARGET must be agent or lab (got: $TARGET)"; exit 1 ;;
                  esac
            post_build:
              commands:
                - echo "pushed TARGET=$TARGET IMAGE_TAG=$IMAGE_TAG to $REG"
      Tags:
        - { Key: Project, Value: !Ref NamePrefix }
        - { Key: owner, Value: !Ref Owner }

Outputs:
  SourceBucketName:
    Value: !Ref SourceBucket
    Description: Upload src.zip (agent/ and lab/snmpd/) here before starting a build.
  ProjectName:
    Value: !Ref Project
    Description: CodeBuild project. Start it from the console (Start build) or with the commands in the README.
  StartAgentBuildCommand:
    Value: !Sub aws codebuild start-build --region ${AWS::Region} --project-name ${Project} --environment-variables-override name=TARGET,value=agent name=IMAGE_TAG,value=v1
    Description: Builds and pushes the agent image (change v1 for every update).
  StartLabBuildCommand:
    Value: !Sub aws codebuild start-build --region ${AWS::Region} --project-name ${Project} --environment-variables-override name=TARGET,value=lab name=IMAGE_TAG,value=v1
    Description: Pulls frr / multitool and builds snmpd, then pushes the three lab images.
