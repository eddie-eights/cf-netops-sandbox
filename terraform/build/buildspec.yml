version: 0.2
phases:
  pre_build:
    commands:
      - REG="$(aws sts get-caller-identity --query Account --output text).dkr.ecr.${AWS_DEFAULT_REGION}.amazonaws.com"
      - aws ecr get-login-password | docker login --username AWS --password-stdin "$REG"
      # zip の中に repo 名のフォルダが 1 段あってもよいように、agent/Dockerfile の場所から根を決める
      - SRC="$(dirname "$(dirname "$(find . -path '*agent/Dockerfile' | head -1)")")"; echo "source root: $SRC"; uname -m
  build:
    commands:
      - |
        set -eu
        # ECR のタグは IMMUTABLE なので、あるタグへ push すると失敗する。無いタグだけ作る
        # （BatchGetImage は無いタグを failures に ImageNotFound で入れて正常終了する。if の条件の中では set -e が効かないので、API の失敗は exit で止める）
        missing() {
          n=$(aws ecr batch-get-image --repository-name "$NAME_PREFIX-$1" --image-ids imageTag="$2" --query "length(failures[?failureCode=='ImageNotFound'])" --output text) || exit 1
          if [ "$n" != "0" ]; then return 0; fi
          echo "$1:$2 はもうあるので飛ばす"; return 1
        }
        case "$TARGET" in
          agent)
            if missing agent "$IMAGE_TAG"; then
              docker build -t "$REG/$NAME_PREFIX-agent:$IMAGE_TAG" "$SRC/agent"
              docker push "$REG/$NAME_PREFIX-agent:$IMAGE_TAG"
            fi
            ;;
          lab)
            if missing lab-frr "$FRR_TAG"; then
              docker pull "quay.io/frrouting/frr:$FRR_TAG"
              docker tag "quay.io/frrouting/frr:$FRR_TAG" "$REG/$NAME_PREFIX-lab-frr:$FRR_TAG"
              docker push "$REG/$NAME_PREFIX-lab-frr:$FRR_TAG"
            fi
            if missing lab-multitool "$MULTITOOL_TAG"; then
              docker pull "wbitt/network-multitool:$MULTITOOL_TAG"
              docker tag "wbitt/network-multitool:$MULTITOOL_TAG" "$REG/$NAME_PREFIX-lab-multitool:$MULTITOOL_TAG"
              docker push "$REG/$NAME_PREFIX-lab-multitool:$MULTITOOL_TAG"
            fi
            if missing lab-snmpd "$IMAGE_TAG"; then
              docker build -t "$REG/$NAME_PREFIX-lab-snmpd:$IMAGE_TAG" "$SRC/lab/snmpd"
              docker push "$REG/$NAME_PREFIX-lab-snmpd:$IMAGE_TAG"
            fi
            ;;
          *) echo "TARGET must be agent or lab (got: $TARGET)"; exit 1 ;;
        esac
  post_build:
    commands:
      - echo "finished TARGET=$TARGET IMAGE_TAG=$IMAGE_TAG (build succeeding=$CODEBUILD_BUILD_SUCCEEDING)"
